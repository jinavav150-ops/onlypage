<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결혼준비 예산관리 & 체크리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe5f0 100%);
            min-height: 100vh;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #d63384;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #ffc0e0;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #d63384;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border-color: #ff1493;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(214, 51, 132, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 예산 관리 스타일 */
        .summary-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ffe5f0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            font-size: 18px;
            font-weight: bold;
        }

        .balance-value {
            color: #d63384;
        }

        .expense-value {
            color: #dc3545;
        }

        .income-value {
            color: #28a745;
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-btn {
            flex: 1;
            padding: 12px;
            background: white;
            border: 2px solid #ffc0e0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #d63384;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn.active {
            background: #ff69b4;
            color: white;
            border-color: #ff69b4;
        }

        .add-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(214, 51, 132, 0.3);
        }

        .items-list {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .item {
            padding: 15px;
            margin-bottom: 10px;
            background: #ffeef8;
            border-radius: 12px;
            border-left: 4px solid #ff69b4;
            position: relative;
        }

        .item-order-buttons {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-order {
            width: 30px;
            height: 30px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-order:hover {
            background: #ff1493;
        }

        .btn-order:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-date {
            font-size: 14px;
            color: #666;
        }

        .item-amount {
            font-size: 18px;
            font-weight: bold;
            color: #d63384;
        }

        .item-description {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-delete:first-child {
            background: #ff69b4;
        }

        .btn-delete:first-child:hover {
            background: #ff1493;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-move {
            padding: 6px 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-move:hover {
            background: #5a6268;
        }

        .move-buttons {
            display: flex;
            gap: 5px;
            margin-right: 8px;
        }

        .drag-handle {
            cursor: move;
            padding: 8px 12px;
            color: #999;
            font-size: 18px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        .drag-handle:hover {
            color: #666;
        }

        .item.dragging {
            opacity: 0.5;
        }

        .item.drag-over {
            border-top: 3px solid #ff69b4;
        }

        .checklist-item.dragging {
            opacity: 0.5;
        }

        .checklist-item.drag-over {
            border-top: 3px solid #ff69b4;
        }

        /* 드래그 중 텍스트 선택 방지 */
        body.dragging-active {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body.dragging-active * {
            cursor: move !important;
        }

        /* 체크리스트 스타일 */
        .checklist-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            margin-bottom: 10px;
            background: #ffeef8;
            border-radius: 12px;
            border-left: 4px solid #ff69b4;
        }

        .checkbox-wrapper {
            margin-right: 12px;
            margin-top: 3px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff69b4;
        }

        .checklist-content {
            flex: 1;
        }

        .checklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .checklist-date {
            font-size: 14px;
            color: #666;
        }

        .checklist-amount {
            font-size: 16px;
            font-weight: bold;
            color: #d63384;
        }

        .checklist-description {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffc0e0;
            border-radius: 10px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff69b4;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #666;
        }

        .no-items {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 15px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: white;
            color: #d63384;
            text-decoration: none;
            border-radius: 10px;
            border: 2px solid #ffc0e0;
            font-weight: bold;
        }

        .back-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div style="display: flex; gap: 8px; margin-bottom: 20px; align-items: center;">
        <a href="index.html" class="back-button" style="margin: 0; padding: 8px 12px; font-size: 13px;">← 메인</a>
        <button class="back-button" style="margin: 0; padding: 8px 12px; font-size: 13px; cursor: pointer; border: 2px solid #ffc0e0;" onclick="undoAction()" id="undo-btn" disabled>↶ 실행취소</button>
        <button class="back-button" style="margin: 0; padding: 8px 12px; font-size: 13px; cursor: pointer; border: 2px solid #ffc0e0;" onclick="redoAction()" id="redo-btn" disabled>↷ 재실행</button>
    </div>
    
    <div class="header">
        <h1>💑 결혼준비 예산관리 & 체크리스트</h1>
    </div>

    <!-- 탭 버튼 -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('budget')">결혼예산</button>
        <button class="tab-btn" onclick="switchTab('checklist')">체크리스트</button>
    </div>

    <!-- 결혼예산 탭 -->
    <div id="budget-tab" class="tab-content active">
        <!-- 요약 섹션 -->
        <div class="summary-section">
            <div class="summary-item">
                <span class="summary-label">💰 통장잔액</span>
                <span class="summary-value balance-value" id="balance">0원</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">💸 지출합계</span>
                <span class="summary-value expense-value" id="total-expense">0원</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">💵 수입합계</span>
                <span class="summary-value income-value" id="total-income">0원</span>
            </div>
        </div>

        <!-- 카테고리 버튼 -->
        <div class="category-buttons">
            <button class="category-btn active" onclick="selectCategory('expense')">지출</button>
            <button class="category-btn" onclick="selectCategory('income')">수입</button>
            <button class="category-btn" onclick="selectCategory('refund')">환불</button>
        </div>

        <!-- 항목 추가 버튼 -->
        <button class="add-button" onclick="openBudgetModal()">+ 항목 추가</button>

        <!-- 항목 리스트 -->
        <div class="items-list" id="budget-items"></div>
    </div>

    <!-- 체크리스트 탭 -->
    <div id="checklist-tab" class="tab-content">
        <button class="add-button" onclick="openChecklistModal()">+ 체크리스트 추가</button>
        <div class="items-list" id="checklist-items"></div>
    </div>

    <!-- 예산 항목 추가 모달 -->
    <div id="budget-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">항목 추가</div>
            <form id="budget-form">
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" id="budget-date" required>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <input type="text" id="budget-description" placeholder="내용을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <input type="number" id="budget-amount" placeholder="금액을 입력하세요" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn btn-cancel" onclick="closeBudgetModal()">취소</button>
                    <button type="submit" class="modal-btn btn-save">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 체크리스트 추가 모달 -->
    <div id="checklist-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">체크리스트 추가</div>
            <form id="checklist-form">
                <div class="form-group">
                    <label>날짜</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="date" id="checklist-date" style="flex: 1;">
                        <label style="display: flex; align-items: center; gap: 5px; margin: 0; white-space: nowrap;">
                            <input type="checkbox" id="checklist-date-tbd" onchange="toggleChecklistDate()">
                            미정
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <input type="text" id="checklist-description" placeholder="할 일을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>금액</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="number" id="checklist-amount" placeholder="예상 금액을 입력하세요" style="flex: 1;">
                        <label style="display: flex; align-items: center; gap: 5px; margin: 0; white-space: nowrap;">
                            <input type="checkbox" id="checklist-amount-tbd" onchange="toggleChecklistAmount()">
                            미정
                        </label>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn btn-cancel" onclick="closeChecklistModal()">취소</button>
                    <button type="submit" class="modal-btn btn-save">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, updateDoc } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBKpRb8lfrYaY42gNhZ4S1_xvPLjjJiXg8",
            authDomain: "dasol-moneybook-2dec7.firebaseapp.com",
            projectId: "dasol-moneybook-2dec7",
            storageBucket: "dasol-moneybook-2dec7.firebasestorage.app",
            messagingSenderId: "1049820880885",
            appId: "1:1049820880885:web:e0a4d0ba10adafde9c8f0f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentCategory = 'expense';
        let budgetItems = [];
        let checklistItems = [];
        let editingBudgetId = null;
        let editingChecklistId = null;

        // 실행 취소/재실행 기능
        let undoStack = [];
        let redoStack = [];
        const MAX_UNDO_STACK = 20; // 최대 20개까지 기록

        function saveStateToUndo(action, data) {
            undoStack.push({ action, data, timestamp: new Date() });
            if (undoStack.length > MAX_UNDO_STACK) {
                undoStack.shift(); // 오래된 것 삭제
            }
            redoStack = []; // 새 작업 시 redo 스택 초기화
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            document.getElementById('undo-btn').disabled = undoStack.length === 0;
            document.getElementById('redo-btn').disabled = redoStack.length === 0;
        }

        window.undoAction = async function() {
            if (undoStack.length === 0) return;
            
            const lastAction = undoStack.pop();
            redoStack.push(lastAction);
            
            try {
                await restoreAction(lastAction, true);
                updateUndoRedoButtons();
            } catch (error) {
                console.error('Undo error:', error);
                alert('이전으로 되돌리는 중 오류가 발생했습니다.');
            }
        };

        window.redoAction = async function() {
            if (redoStack.length === 0) return;
            
            const nextAction = redoStack.pop();
            undoStack.push(nextAction);
            
            try {
                await restoreAction(nextAction, false);
                updateUndoRedoButtons();
            } catch (error) {
                console.error('Redo error:', error);
                alert('다음으로 이동하는 중 오류가 발생했습니다.');
            }
        };

        async function restoreAction(action, isUndo) {
            const { action: type, data } = action;
            
            if (type === 'add') {
                if (isUndo) {
                    // 추가를 취소 = 삭제
                    await deleteDoc(doc(db, data.collection, data.id));
                } else {
                    // 추가 재실행
                    await addDoc(collection(db, data.collection), data.item);
                }
            } else if (type === 'delete') {
                if (isUndo) {
                    // 삭제를 취소 = 복원
                    await addDoc(collection(db, data.collection), data.item);
                } else {
                    // 삭제 재실행
                    await deleteDoc(doc(db, data.collection, data.id));
                }
            } else if (type === 'update') {
                if (isUndo) {
                    // 이전 값으로 복원
                    await updateDoc(doc(db, data.collection, data.id), data.oldValue);
                } else {
                    // 새 값으로 변경
                    await updateDoc(doc(db, data.collection, data.id), data.newValue);
                }
            } else if (type === 'reorder') {
                // 순서 변경 복원
                const orders = isUndo ? data.oldOrders : data.newOrders;
                
                for (const [id, order] of Object.entries(orders)) {
                    await updateDoc(doc(db, data.collection, id), {
                        customOrder: order
                    });
                }
            }
        }

        // 체크리스트 날짜/금액 미정 토글 함수 추가
        window.toggleChecklistDate = function() {
            const dateInput = document.getElementById('checklist-date');
            const checkbox = document.getElementById('checklist-date-tbd');
            dateInput.disabled = checkbox.checked;
            if (checkbox.checked) {
                dateInput.value = '';
            }
        };

        window.toggleChecklistAmount = function() {
            const amountInput = document.getElementById('checklist-amount');
            const checkbox = document.getElementById('checklist-amount-tbd');
            amountInput.disabled = checkbox.checked;
            if (checkbox.checked) {
                amountInput.value = '';
            }
        };

        // 탭 전환
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'budget') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('budget-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('checklist-tab').classList.add('active');
            }
        };

        // 카테고리 선택
        window.selectCategory = function(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderBudgetItems();
        };

        // 예산 모달
        window.openBudgetModal = function() {
            editingBudgetId = null;
            document.getElementById('budget-modal').style.display = 'block';
            document.getElementById('budget-date').valueAsDate = new Date();
            document.querySelector('#budget-modal .modal-header').textContent = '항목 추가';
        };

        window.closeBudgetModal = function() {
            document.getElementById('budget-modal').style.display = 'none';
            document.getElementById('budget-form').reset();
            editingBudgetId = null;
        };

        // 예산 항목 수정 모달 열기
        window.editBudgetItem = function(id) {
            const item = budgetItems.find(item => item.id === id);
            if (!item) return;

            editingBudgetId = id;
            document.getElementById('budget-date').value = item.date;
            document.getElementById('budget-description').value = item.description;
            document.getElementById('budget-amount').value = item.amount;
            document.querySelector('#budget-modal .modal-header').textContent = '항목 수정';
            document.getElementById('budget-modal').style.display = 'block';
        };

        // 체크리스트 모달
        window.openChecklistModal = function() {
            editingChecklistId = null;
            document.getElementById('checklist-modal').style.display = 'block';
            document.getElementById('checklist-date').valueAsDate = new Date();
            document.querySelector('#checklist-modal .modal-header').textContent = '체크리스트 추가';
        };

        window.closeChecklistModal = function() {
            document.getElementById('checklist-modal').style.display = 'none';
            document.getElementById('checklist-form').reset();
            editingChecklistId = null;
        };

        // 체크리스트 항목 수정 모달 열기
        window.editChecklistItem = function(id) {
            const item = checklistItems.find(item => item.id === id);
            if (!item) return;

            editingChecklistId = id;
            
            // 날짜 설정
            const dateTbd = item.date === 'TBD';
            document.getElementById('checklist-date-tbd').checked = dateTbd;
            document.getElementById('checklist-date').disabled = dateTbd;
            document.getElementById('checklist-date').value = dateTbd ? '' : item.date;
            
            // 금액 설정

                        document.body.classList.add('dragging-active');
                    }, { passive: false });

                    handle.addEventListener('touchmove', (e) => {
                        if (!isDragging) return;
                        e.preventDefault();
                        
                        const touch = e.touches[0];
                        const currentY = touch.clientY;
                        
                        // 터치 위치에 있는 요소 찾기
                        const elementsAtPoint = document.elementsFromPoint(touch.clientX, currentY);
                        const targetItem = elementsAtPoint.find(el =>

                        );
                        
                        // 모든 drag-over 제거

                        const touch = e.changedTouches[0];

        async function reorderBudgetItems(draggedId, targetId) {
            const filteredItems = budgetItems.filter(item => item.category === currentCategory);
            const draggedIndex = filteredItems.findIndex(item => item.id === draggedId);
            const targetIndex = filteredItems.findIndex(item => item.id === targetId);

            if (draggedIndex === -1 || targetIndex === -1) return;

            // 현재 customOrder 값들을 저장 (undo용)
            const oldOrders = {};
            filteredItems.forEach(item => {
                oldOrders[item.id] = item.customOrder;
            });

            // 배열에서 항목 이동
            const reordered = [...filteredItems];
            const [draggedItem] = reordered.splice(draggedIndex, 1);
            reordered.splice(targetIndex, 0, draggedItem);

            // 새로운 customOrder 계산
            const newOrders = {};
            reordered.forEach((item, index) => {
                newOrders[item.id] = index;
            });

            // Firebase에 customOrder 업데이트
            try {
                for (let i = 0; i < reordered.length; i++) {
                    await updateDoc(doc(db, 'weddingBudget', reordered[i].id), {
                        customOrder: i
                    });
                }

                // undo 스택에 저장
                saveStateToUndo('reorder', {
                    collection: 'weddingBudget',
                    oldOrders: oldOrders,
                    newOrders: newOrders
                });

                alert('순서 변경 중 오류가 발생했습니다.');

        // 요약 정보 업데이트
        function updateSummary() {
            const expenses = budgetItems
                .filter(item => item.category === 'expense')
                .reduce((sum, item) => sum + item.amount, 0);
            
            const income = budgetItems
                .filter(item => item.category === 'income')
                .reduce((sum, item) => sum + item.amount, 0);
            
            const refunds = budgetItems
                .filter(item => item.category === 'refund')
                .reduce((sum, item) => sum + item.amount, 0);
            
            // 환불은 지출에서 차감
            const totalExpense = expenses - refunds;
            // 잔액 = 수입 - (지출 - 환불)
            const balance = income - totalExpense;

            document.getElementById('balance').textContent = formatCurrency(balance);
            document.getElementById('total-expense').textContent = formatCurrency(totalExpense);
            document.getElementById('total-income').textContent = formatCurrency(income);
        }

        // 예산 항목 실시간 업데이트
        const budgetQuery = query(collection(db, 'weddingBudget'));
        onSnapshot(budgetQuery, (snapshot) => {
            budgetItems = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            // order, customOrder 필드 초기화
            budgetItems.forEach((item, index) => {
                if (item.order === undefined) {
                    item.order = index;
                }
                if (item.customOrder === undefined) {
                    item.customOrder = null;
                }
            });
            
            // 카테고리별로 정렬
            const categories = ['expense', 'income', 'refund'];
            categories.forEach(category => {
                const categoryItems = budgetItems.filter(item => item.category === category);
                
                // customOrder가 있는 항목과 없는 항목 분리
                const withCustomOrder = categoryItems.filter(item => item.customOrder !== null && item.customOrder !== undefined);
                const withoutCustomOrder = categoryItems.filter(item => item.customOrder === null || item.customOrder === undefined);
                
                // customOrder가 있는 항목은 customOrder로 정렬
                withCustomOrder.sort((a, b) => a.customOrder - b.customOrder);
                
                // customOrder가 없는 항목은 날짜 내림차순 (최신 → 과거)
                withoutCustomOrder.sort((a, b) => b.date.localeCompare(a.date));
                
                // 합치기: 날짜순 항목들이 위, customOrder 있는 항목들이 아래
                const sortedCategory = [...withoutCustomOrder, ...withCustomOrder];
                
                // 원본 배열에서 해당 카테고리 항목 교체
                budgetItems = budgetItems.filter(item => item.category !== category).concat(sortedCategory);
            });
            
            renderBudgetItems();
            updateSummary();
        });

        // 체크리스트 실시간 업데이트
        const checklistQuery = query(collection(db, 'weddingChecklist'));
        onSnapshot(checklistQuery, (snapshot) => {
            checklistItems = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            // order, customOrder 필드 초기화
            checklistItems.forEach((item, index) => {
                if (item.order === undefined) {
                    item.order = index;
                }
                if (item.customOrder === undefined) {
                    item.customOrder = null;
                }
            });
            
            // customOrder가 있는 항목과 없는 항목 분리
            const withCustomOrder = checklistItems.filter(item => item.customOrder !== null && item.customOrder !== undefined);
            const withoutCustomOrder = checklistItems.filter(item => item.customOrder === null || item.customOrder === undefined);
            
            // customOrder가 있는 항목은 customOrder로 정렬
            withCustomOrder.sort((a, b) => a.customOrder - b.customOrder);
            
            // customOrder가 없는 항목은 날짜 정렬 (미정 → 최신 → 과거)
            withoutCustomOrder.sort((a, b) => {
                // 미정 항목 처리
                if (a.date === 'TBD' && b.date !== 'TBD') return -1;
                if (a.date !== 'TBD' && b.date === 'TBD') return 1;
                if (a.date === 'TBD' && b.date === 'TBD') return 0;
                
                // 날짜 내림차순 (최신 → 과거) - 위로 갈수록 최신
                return b.date.localeCompare(a.date);
            });
            
            // 합치기: 날짜순 항목들이 위, customOrder 있는 항목들이 아래
            checklistItems = [...withoutCustomOrder, ...withCustomOrder];
            
            renderChecklistItems();
        });

        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };
    </script>
</body>
</html>
