<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 다솔, 호철 부자되기 프로젝트</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow-x: hidden;
            background: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        
        #root {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border-radius: 20px;
            overflow: hidden;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0;
                background: white;
            }
            #root {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
            }
        }
        
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        
        // Firebase 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyCqFjwBKOKRMVkSNOhVeFbl0M0yNfKj7TM",
            authDomain: "dasol-moneybook-2dec7.firebaseapp.com",
            projectId: "dasol-moneybook-2dec7",
            storageBucket: "dasol-moneybook-2dec7.firebasestorage.app",
            messagingSenderId: "998075249498",
            appId: "1:998075249498:web:c4900bdf80094b78b4ed85"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // ==================== 메인 앱 ====================
        function SavingProject() {
            // 계좌(탭) 목록
            const [accounts, setAccounts] = useState([]);
            const [activeAccount, setActiveAccount] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            
            // 각 계좌별 데이터
            const [accountData, setAccountData] = useState({});
            
            // UI 상태
            const [expandedSection, setExpandedSection] = useState(null); // 'principal', 'interest', 'memo'
            const [showAddAccount, setShowAddAccount] = useState(false);
            const [newAccountName, setNewAccountName] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            
            // 추가 폼 상태
            const [showAddForm, setShowAddForm] = useState(null); // 'principal' or 'interest'
            const [addFormData, setAddFormData] = useState({ date: '', amount: '', memo: '' });
            
            // 편집 상태
            const [editingItem, setEditingItem] = useState(null);
            const [editFormData, setEditFormData] = useState({ date: '', amount: '', memo: '' });
            
            // 메모 편집
            const [memoText, setMemoText] = useState('');
            const [isMemoEditing, setIsMemoEditing] = useState(false);
            const [memoBackup, setMemoBackup] = useState('');
            
            // Firestore 컬렉션
            const COLLECTION = 'saving_project';
            
            // ========== 데이터 로드 ==========
            useEffect(() => {
                const unsubscribe = db.collection(COLLECTION).doc('accounts').onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const accs = data.list || [];
                        setAccounts(accs);
                        
                        // 마지막 선택 계좌 복원
                        const lastActive = localStorage.getItem('saving_active_account');
                        if (lastActive && accs.includes(lastActive)) {
                            setActiveAccount(lastActive);
                        } else if (accs.length > 0) {
                            setActiveAccount(accs[0]);
                        }
                    } else {
                        // 초기 계좌 생성
                        const defaultAccounts = ['결혼자금남은거', '비상금', '비상금2'];
                        db.collection(COLLECTION).doc('accounts').set({ list: defaultAccounts });
                        setAccounts(defaultAccounts);
                        setActiveAccount(defaultAccounts[0]);
                    }
                    setIsLoading(false);
                });
                
                return () => unsubscribe();
            }, []);
            
            // 활성 계좌 데이터 로드
            useEffect(() => {
                if (!activeAccount) return;
                
                localStorage.setItem('saving_active_account', activeAccount);
                
                const docId = activeAccount.replace(/[\/\\]/g, '_');
                const unsubscribe = db.collection(COLLECTION).doc(docId).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        setAccountData(prev => ({ ...prev, [activeAccount]: data }));
                        setMemoText(data.memo || '');
                    } else {
                        const emptyData = { principal: [], interest: [], memo: '' };
                        setAccountData(prev => ({ ...prev, [activeAccount]: emptyData }));
                        setMemoText('');
                    }
                });
                
                return () => unsubscribe();
            }, [activeAccount]);
            
            // ========== 저장 함수 ==========
            const saveAccountData = useCallback(async (accName, data) => {
                try {
                    const docId = accName.replace(/[\/\\]/g, '_');
                    await db.collection(COLLECTION).doc(docId).set(data, { merge: true });
                    console.log('저장 완료:', accName);
                } catch (err) {
                    console.error('저장 실패:', err);
                    alert('저장에 실패했습니다. 인터넷 연결을 확인해주세요.');
                }
            }, []);
            
            // ========== 계좌 관리 ==========
            const addAccount = () => {
                const name = newAccountName.trim();
                if (!name) return;
                if (accounts.includes(name)) {
                    alert('이미 존재하는 계좌입니다.');
                    return;
                }
                const newList = [...accounts, name];
                db.collection(COLLECTION).doc('accounts').set({ list: newList });
                setNewAccountName('');
                setShowAddAccount(false);
                setActiveAccount(name);
            };
            
            const deleteAccount = (accName) => {
                if (!confirm(`"${accName}" 계좌를 삭제하시겠습니까?\n모든 데이터가 삭제됩니다.`)) return;
                const newList = accounts.filter(a => a !== accName);
                db.collection(COLLECTION).doc('accounts').set({ list: newList });
                
                const docId = accName.replace(/[\/\\]/g, '_');
                db.collection(COLLECTION).doc(docId).delete();
                
                if (activeAccount === accName) {
                    setActiveAccount(newList[0] || '');
                }
            };
            
            const renameAccount = (oldName) => {
                const newName = prompt('새 이름을 입력하세요:', oldName);
                if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
                if (accounts.includes(newName.trim())) {
                    alert('이미 존재하는 이름입니다.');
                    return;
                }
                
                const trimmed = newName.trim();
                const newList = accounts.map(a => a === oldName ? trimmed : a);
                db.collection(COLLECTION).doc('accounts').set({ list: newList });
                
                // 데이터 이동
                const oldDocId = oldName.replace(/[\/\\]/g, '_');
                const newDocId = trimmed.replace(/[\/\\]/g, '_');
                const oldData = accountData[oldName];
                if (oldData) {
                    db.collection(COLLECTION).doc(newDocId).set(oldData);
                    db.collection(COLLECTION).doc(oldDocId).delete();
                }
                
                if (activeAccount === oldName) {
                    setActiveAccount(trimmed);
                }
            };
            
            // ========== 항목 추가/삭제/수정 ==========
            const currentData = accountData[activeAccount] || { principal: [], interest: [], memo: '' };
            
            const addItem = (type) => {
                const { date, amount, memo } = addFormData;
                if (!date || !amount) {
                    alert('날짜와 금액을 입력해주세요.');
                    return;
                }
                
                const newItem = {
                    id: Date.now().toString(),
                    date,
                    amount: parseInt(amount),
                    memo: memo || ''
                };
                
                const updatedList = [...(currentData[type] || []), newItem];
                // 날짜순 정렬
                updatedList.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const updatedData = { ...currentData, [type]: updatedList };
                setAccountData(prev => ({ ...prev, [activeAccount]: updatedData }));
                saveAccountData(activeAccount, updatedData);
                
                setAddFormData({ date: '', amount: '', memo: '' });
                setShowAddForm(null);
            };
            
            const deleteItem = (type, itemId) => {
                if (!confirm('삭제하시겠습니까?')) return;
                const updatedList = (currentData[type] || []).filter(item => item.id !== itemId);
                const updatedData = { ...currentData, [type]: updatedList };
                setAccountData(prev => ({ ...prev, [activeAccount]: updatedData }));
                saveAccountData(activeAccount, updatedData);
            };
            
            const startEdit = (type, item) => {
                setEditingItem({ type, id: item.id });
                setEditFormData({ date: item.date, amount: item.amount.toString(), memo: item.memo || '' });
            };
            
            const saveEdit = () => {
                if (!editingItem) return;
                const { type, id } = editingItem;
                const { date, amount, memo } = editFormData;
                if (!date || !amount) {
                    alert('날짜와 금액을 입력해주세요.');
                    return;
                }
                
                const updatedList = (currentData[type] || []).map(item => 
                    item.id === id ? { ...item, date, amount: parseInt(amount), memo: memo || '' } : item
                );
                updatedList.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const updatedData = { ...currentData, [type]: updatedList };
                setAccountData(prev => ({ ...prev, [activeAccount]: updatedData }));
                saveAccountData(activeAccount, updatedData);
                
                setEditingItem(null);
                setEditFormData({ date: '', amount: '', memo: '' });
            };
            
            const cancelEdit = () => {
                setEditingItem(null);
                setEditFormData({ date: '', amount: '', memo: '' });
            };
            
            // ========== 메모 수정/저장 ==========
            const startMemoEdit = () => {
                setMemoBackup(memoText);
                setIsMemoEditing(true);
            };
            
            const saveMemo = () => {
                const updatedData = { ...currentData, memo: memoText };
                saveAccountData(activeAccount, updatedData);
                setIsMemoEditing(false);
            };
            
            const cancelMemoEdit = () => {
                setMemoText(memoBackup);
                setIsMemoEditing(false);
            };
            
            // ========== 계산 ==========
            const principalTotal = (currentData.principal || []).reduce((sum, item) => sum + item.amount, 0);
            const interestTotal = (currentData.interest || []).reduce((sum, item) => sum + item.amount, 0);
            const expenseTotal = (currentData.expense || []).reduce((sum, item) => sum + item.amount, 0);
            const balance = principalTotal + interestTotal - expenseTotal;
            
            // ========== 금액 포맷 ==========
            const formatMoney = (amount) => {
                if (amount === 0) return '0원';
                return amount.toLocaleString('ko-KR') + '원';
            };
            
            // ========== 날짜 포맷 ==========
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return `${d.getFullYear()}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getDate().toString().padStart(2,'0')}`;
            };
            
            // ========== 로딩 ==========
            if (isLoading) {
                return (
                    <div style={{display:'flex',justifyContent:'center',alignItems:'center',height:'100vh',background:'linear-gradient(135deg,#1a1a2e,#16213e)'}}>
                        <div style={{textAlign:'center',color:'white'}}>
                            <div style={{fontSize:'48px',marginBottom:'16px'}}>💰</div>
                            <div style={{fontSize:'18px',fontWeight:'600'}}>로딩중...</div>
                        </div>
                    </div>
                );
            }
            
            // ========== 렌더링 ==========
            return (
                <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)'}}>
                    {/* 헤더 */}
                    <div style={{
                        background:'linear-gradient(135deg,#667eea,#764ba2)',
                        padding:'20px 16px 16px',
                        position:'sticky',top:0,zIndex:100
                    }}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                            <a href="index.html" style={{
                                color:'rgba(255,255,255,0.8)',fontSize:'22px',textDecoration:'none'
                            }}>←</a>
                            <h1 style={{color:'white',fontSize:'18px',fontWeight:'700',letterSpacing:'-0.5px'}}>
                                💰 다솔, 호철 부자되기 프로젝트
                            </h1>
                            <button onClick={() => setShowSettings(!showSettings)} style={{
                                background:'none',border:'none',color:'rgba(255,255,255,0.8)',
                                fontSize:'20px',cursor:'pointer'
                            }}>⚙️</button>
                        </div>
                        
                        {/* 계좌 탭 */}
                        <div className="scrollbar-hide" style={{
                            display:'flex',gap:'8px',overflowX:'auto',paddingBottom:'4px'
                        }}>
                            {accounts.map(acc => (
                                <button key={acc} onClick={() => {
                                    setActiveAccount(acc);
                                    setExpandedSection(null);
                                    setShowAddForm(null);
                                    setEditingItem(null);
                                }} style={{
                                    padding:'8px 16px',
                                    borderRadius:'20px',
                                    border: activeAccount === acc ? '2px solid white' : '2px solid rgba(255,255,255,0.3)',
                                    background: activeAccount === acc ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)',
                                    color:'white',
                                    fontSize:'13px',
                                    fontWeight: activeAccount === acc ? '700' : '500',
                                    cursor:'pointer',
                                    whiteSpace:'nowrap',
                                    transition:'all 0.2s'
                                }}>
                                    {acc}
                                </button>
                            ))}
                            <button onClick={() => setShowAddAccount(true)} style={{
                                padding:'8px 14px',borderRadius:'20px',
                                border:'2px dashed rgba(255,255,255,0.4)',
                                background:'transparent',color:'rgba(255,255,255,0.7)',
                                fontSize:'13px',cursor:'pointer',whiteSpace:'nowrap'
                            }}>+ 추가</button>
                        </div>
                    </div>
                    
                    {/* 계좌 추가 모달 */}
                    {showAddAccount && (
                        <div style={{
                            position:'fixed',top:0,left:0,right:0,bottom:0,
                            background:'rgba(0,0,0,0.6)',zIndex:200,
                            display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'
                        }} onClick={() => setShowAddAccount(false)}>
                            <div style={{
                                background:'white',borderRadius:'20px',padding:'24px',
                                width:'100%',maxWidth:'350px'
                            }} onClick={e => e.stopPropagation()}>
                                <h3 style={{fontSize:'18px',fontWeight:'700',marginBottom:'16px',color:'#1a1a2e'}}>
                                    새 계좌 추가
                                </h3>
                                <input
                                    type="text"
                                    placeholder="계좌 이름 (예: 적금, CMA...)"
                                    value={newAccountName}
                                    onChange={e => setNewAccountName(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && addAccount()}
                                    autoFocus
                                    style={{
                                        width:'100%',padding:'12px 16px',borderRadius:'12px',
                                        border:'2px solid #e5e7eb',fontSize:'15px',outline:'none',
                                        marginBottom:'16px'
                                    }}
                                />
                                <div style={{display:'flex',gap:'10px'}}>
                                    <button onClick={() => setShowAddAccount(false)} style={{
                                        flex:1,padding:'12px',borderRadius:'12px',border:'none',
                                        background:'#f3f4f6',color:'#666',fontSize:'15px',
                                        fontWeight:'600',cursor:'pointer'
                                    }}>취소</button>
                                    <button onClick={addAccount} style={{
                                        flex:1,padding:'12px',borderRadius:'12px',border:'none',
                                        background:'linear-gradient(135deg,#667eea,#764ba2)',
                                        color:'white',fontSize:'15px',fontWeight:'600',cursor:'pointer'
                                    }}>추가</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* 설정 패널 */}
                    {showSettings && (
                        <div style={{
                            background:'rgba(255,255,255,0.05)',
                            borderBottom:'1px solid rgba(255,255,255,0.1)',
                            padding:'16px'
                        }}>
                            <h3 style={{color:'white',fontSize:'15px',fontWeight:'700',marginBottom:'12px'}}>
                                계좌 관리
                            </h3>
                            {accounts.map(acc => (
                                <div key={acc} style={{
                                    display:'flex',justifyContent:'space-between',alignItems:'center',
                                    padding:'10px 12px',background:'rgba(255,255,255,0.08)',
                                    borderRadius:'10px',marginBottom:'8px'
                                }}>
                                    <span style={{color:'white',fontSize:'14px'}}>{acc}</span>
                                    <div style={{display:'flex',gap:'8px'}}>
                                        <button onClick={() => renameAccount(acc)} style={{
                                            background:'rgba(255,255,255,0.15)',border:'none',
                                            color:'white',padding:'6px 12px',borderRadius:'8px',
                                            fontSize:'12px',cursor:'pointer'
                                        }}>이름변경</button>
                                        <button onClick={() => deleteAccount(acc)} style={{
                                            background:'rgba(255,59,48,0.3)',border:'none',
                                            color:'#ff6b6b',padding:'6px 12px',borderRadius:'8px',
                                            fontSize:'12px',cursor:'pointer'
                                        }}>삭제</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    {/* 메인 콘텐츠 */}
                    <div style={{padding:'16px'}}>
                        {/* 요약 카드 4개 */}
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'20px'}}>
                            {/* 통장잔액 */}
                            <div style={{
                                background:'linear-gradient(135deg,#667eea,#764ba2)',
                                borderRadius:'16px',padding:'16px 12px',textAlign:'center'
                            }}>
                                <div style={{color:'rgba(255,255,255,0.7)',fontSize:'11px',fontWeight:'600',marginBottom:'6px'}}>
                                    통장잔액
                                </div>
                                <div style={{color:'white',fontSize:'17px',fontWeight:'800',wordBreak:'break-all'}}>
                                    {formatMoney(balance)}
                                </div>
                            </div>
                            {/* 원금 */}
                            <div style={{
                                background:'linear-gradient(135deg,#11998e,#38ef7d)',
                                borderRadius:'16px',padding:'16px 12px',textAlign:'center'
                            }}>
                                <div style={{color:'rgba(255,255,255,0.7)',fontSize:'11px',fontWeight:'600',marginBottom:'6px'}}>
                                    원금
                                </div>
                                <div style={{color:'white',fontSize:'17px',fontWeight:'800',wordBreak:'break-all'}}>
                                    {formatMoney(principalTotal)}
                                </div>
                            </div>
                            {/* 이자 */}
                            <div style={{
                                background:'linear-gradient(135deg,#f093fb,#f5576c)',
                                borderRadius:'16px',padding:'16px 12px',textAlign:'center'
                            }}>
                                <div style={{color:'rgba(255,255,255,0.7)',fontSize:'11px',fontWeight:'600',marginBottom:'6px'}}>
                                    이자
                                </div>
                                <div style={{color:'white',fontSize:'17px',fontWeight:'800',wordBreak:'break-all'}}>
                                    {formatMoney(interestTotal)}
                                </div>
                            </div>
                            {/* 지출 */}
                            <div style={{
                                background:'linear-gradient(135deg,#ff6b6b,#ee5a24)',
                                borderRadius:'16px',padding:'16px 12px',textAlign:'center'
                            }}>
                                <div style={{color:'rgba(255,255,255,0.7)',fontSize:'11px',fontWeight:'600',marginBottom:'6px'}}>
                                    지출
                                </div>
                                <div style={{color:'white',fontSize:'17px',fontWeight:'800',wordBreak:'break-all'}}>
                                    {formatMoney(expenseTotal)}
                                </div>
                            </div>
                        </div>
                        
                        {/* 아코디언 섹션: 원금 */}
                        <SectionAccordion
                            title="원금"
                            emoji="💵"
                            color="#11998e"
                            gradientFrom="#11998e"
                            gradientTo="#38ef7d"
                            isExpanded={expandedSection === 'principal'}
                            onToggle={() => {
                                setExpandedSection(expandedSection === 'principal' ? null : 'principal');
                                setShowAddForm(null);
                                setEditingItem(null);
                            }}
                            items={currentData.principal || []}
                            type="principal"
                            onAdd={() => {
                                setShowAddForm(showAddForm === 'principal' ? null : 'principal');
                                setAddFormData({ date: getTodayStr(), amount: '', memo: '' });
                            }}
                            onDelete={(id) => deleteItem('principal', id)}
                            onEdit={(item) => startEdit('principal', item)}
                            showAddForm={showAddForm === 'principal'}
                            addFormData={addFormData}
                            setAddFormData={setAddFormData}
                            onAddSubmit={() => addItem('principal')}
                            onAddCancel={() => setShowAddForm(null)}
                            editingItem={editingItem}
                            editFormData={editFormData}
                            setEditFormData={setEditFormData}
                            onEditSave={saveEdit}
                            onEditCancel={cancelEdit}
                            formatMoney={formatMoney}
                            formatDate={formatDate}
                        />
                        
                        {/* 아코디언 섹션: 이자 */}
                        <SectionAccordion
                            title="이자"
                            emoji="📈"
                            color="#f5576c"
                            gradientFrom="#f093fb"
                            gradientTo="#f5576c"
                            isExpanded={expandedSection === 'interest'}
                            onToggle={() => {
                                setExpandedSection(expandedSection === 'interest' ? null : 'interest');
                                setShowAddForm(null);
                                setEditingItem(null);
                            }}
                            items={currentData.interest || []}
                            type="interest"
                            onAdd={() => {
                                setShowAddForm(showAddForm === 'interest' ? null : 'interest');
                                setAddFormData({ date: getTodayStr(), amount: '', memo: '' });
                            }}
                            onDelete={(id) => deleteItem('interest', id)}
                            onEdit={(item) => startEdit('interest', item)}
                            showAddForm={showAddForm === 'interest'}
                            addFormData={addFormData}
                            setAddFormData={setAddFormData}
                            onAddSubmit={() => addItem('interest')}
                            onAddCancel={() => setShowAddForm(null)}
                            editingItem={editingItem}
                            editFormData={editFormData}
                            setEditFormData={setEditFormData}
                            onEditSave={saveEdit}
                            onEditCancel={cancelEdit}
                            formatMoney={formatMoney}
                            formatDate={formatDate}
                        />
                        
                        {/* 아코디언 섹션: 지출 */}
                        <SectionAccordion
                            title="지출"
                            emoji="💸"
                            color="#ee5a24"
                            gradientFrom="#ff6b6b"
                            gradientTo="#ee5a24"
                            isExpanded={expandedSection === 'expense'}
                            onToggle={() => {
                                setExpandedSection(expandedSection === 'expense' ? null : 'expense');
                                setShowAddForm(null);
                                setEditingItem(null);
                            }}
                            items={currentData.expense || []}
                            type="expense"
                            onAdd={() => {
                                setShowAddForm(showAddForm === 'expense' ? null : 'expense');
                                setAddFormData({ date: getTodayStr(), amount: '', memo: '' });
                            }}
                            onDelete={(id) => deleteItem('expense', id)}
                            onEdit={(item) => startEdit('expense', item)}
                            showAddForm={showAddForm === 'expense'}
                            addFormData={addFormData}
                            setAddFormData={setAddFormData}
                            onAddSubmit={() => addItem('expense')}
                            onAddCancel={() => setShowAddForm(null)}
                            editingItem={editingItem}
                            editFormData={editFormData}
                            setEditFormData={setEditFormData}
                            onEditSave={saveEdit}
                            onEditCancel={cancelEdit}
                            formatMoney={formatMoney}
                            formatDate={formatDate}
                        />
                        
                        {/* 아코디언 섹션: 메모 */}
                        <div style={{marginBottom:'12px'}}>
                            <button onClick={() => {
                                setExpandedSection(expandedSection === 'memo' ? null : 'memo');
                                setShowAddForm(null);
                                setEditingItem(null);
                                setIsMemoEditing(false);
                            }} style={{
                                width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',
                                padding:'16px',
                                background:'linear-gradient(135deg,#ffecd2,#fcb69f)',
                                borderRadius: expandedSection === 'memo' ? '16px 16px 0 0' : '16px',
                                border:'none',cursor:'pointer',transition:'all 0.2s'
                            }}>
                                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                                    <span style={{fontSize:'20px'}}>📝</span>
                                    <span style={{fontSize:'16px',fontWeight:'700',color:'#1a1a2e'}}>메모</span>
                                </div>
                                <span style={{
                                    fontSize:'18px',color:'#1a1a2e',
                                    transform: expandedSection === 'memo' ? 'rotate(180deg)' : 'rotate(0deg)',
                                    transition:'transform 0.2s'
                                }}>▼</span>
                            </button>
                            
                            {expandedSection === 'memo' && (
                                <div style={{
                                    background:'rgba(255,255,255,0.08)',
                                    borderRadius:'0 0 16px 16px',
                                    padding:'16px',
                                    border:'1px solid rgba(255,255,255,0.1)',
                                    borderTop:'none'
                                }}>
                                    {isMemoEditing ? (
                                        /* 수정 모드 */
                                        <div>
                                            <textarea
                                                value={memoText}
                                                onChange={e => setMemoText(e.target.value)}
                                                placeholder="자유롭게 메모를 작성하세요..."
                                                autoFocus
                                                style={{
                                                    width:'100%',minHeight:'150px',padding:'14px',
                                                    borderRadius:'12px',border:'2px solid #fcb69f',
                                                    background:'rgba(255,255,255,0.1)',color:'white',
                                                    fontSize:'14px',lineHeight:'1.6',resize:'vertical',
                                                    outline:'none',fontFamily:'inherit'
                                                }}
                                            />
                                            <div style={{display:'flex',gap:'10px',marginTop:'12px'}}>
                                                <button onClick={cancelMemoEdit} style={{
                                                    flex:1,padding:'12px',borderRadius:'12px',border:'none',
                                                    background:'rgba(255,255,255,0.1)',
                                                    color:'rgba(255,255,255,0.6)',fontSize:'14px',
                                                    fontWeight:'600',cursor:'pointer'
                                                }}>취소</button>
                                                <button onClick={saveMemo} style={{
                                                    flex:1,padding:'12px',borderRadius:'12px',border:'none',
                                                    background:'linear-gradient(135deg,#ffecd2,#fcb69f)',
                                                    color:'#1a1a2e',fontSize:'14px',
                                                    fontWeight:'700',cursor:'pointer'
                                                }}>💾 저장</button>
                                            </div>
                                        </div>
                                    ) : (
                                        /* 읽기 모드 */
                                        <div>
                                            <div style={{
                                                width:'100%',minHeight:'80px',padding:'14px',
                                                borderRadius:'12px',border:'1px solid rgba(255,255,255,0.1)',
                                                background:'rgba(255,255,255,0.04)',color:'white',
                                                fontSize:'14px',lineHeight:'1.6',
                                                whiteSpace:'pre-wrap',wordBreak:'break-word'
                                            }}>
                                                {memoText || <span style={{color:'rgba(255,255,255,0.3)'}}>메모가 없습니다</span>}
                                            </div>
                                            <div style={{marginTop:'12px',textAlign:'right'}}>
                                                <button onClick={startMemoEdit} style={{
                                                    padding:'10px 24px',borderRadius:'12px',border:'none',
                                                    background:'linear-gradient(135deg,#ffecd2,#fcb69f)',
                                                    color:'#1a1a2e',fontSize:'14px',
                                                    fontWeight:'700',cursor:'pointer'
                                                }}>✏️ 수정</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        
                    </div>
                    
                    {/* 하단 홈 버튼 */}
                    <div style={{
                        padding:'20px 16px 40px',textAlign:'center'
                    }}>
                        <a href="index.html" style={{
                            display:'inline-block',padding:'14px 40px',
                            background:'rgba(255,255,255,0.1)',borderRadius:'30px',
                            color:'rgba(255,255,255,0.6)',textDecoration:'none',
                            fontSize:'14px',fontWeight:'600',
                            border:'1px solid rgba(255,255,255,0.15)'
                        }}>🏠 메인으로</a>
                    </div>
                </div>
            );
        }
        
        // ==================== 오늘 날짜 ====================
        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        }
        
        // ==================== 아코디언 섹션 컴포넌트 ====================
        function SectionAccordion({
            title, emoji, color, gradientFrom, gradientTo,
            isExpanded, onToggle,
            items, type, onAdd, onDelete, onEdit,
            showAddForm, addFormData, setAddFormData, onAddSubmit, onAddCancel,
            editingItem, editFormData, setEditFormData, onEditSave, onEditCancel,
            formatMoney, formatDate
        }) {
            const itemCount = items.length;
            const total = items.reduce((sum, item) => sum + item.amount, 0);
            
            return (
                <div style={{marginBottom:'12px'}}>
                    {/* 헤더 */}
                    <button onClick={onToggle} style={{
                        width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',
                        padding:'16px',
                        background:`linear-gradient(135deg,${gradientFrom},${gradientTo})`,
                        borderRadius: isExpanded ? '16px 16px 0 0' : '16px',
                        border:'none',cursor:'pointer',transition:'all 0.2s'
                    }}>
                        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                            <span style={{fontSize:'20px'}}>{emoji}</span>
                            <span style={{fontSize:'16px',fontWeight:'700',color:'white'}}>{title}</span>
                            <span style={{
                                background:'rgba(255,255,255,0.25)',padding:'2px 8px',
                                borderRadius:'10px',fontSize:'12px',color:'white',fontWeight:'600'
                            }}>{itemCount}건</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                            <span style={{fontSize:'14px',fontWeight:'700',color:'white'}}>
                                {formatMoney(total)}
                            </span>
                            <span style={{
                                fontSize:'18px',color:'white',
                                transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)',
                                transition:'transform 0.2s'
                            }}>▼</span>
                        </div>
                    </button>
                    
                    {/* 콘텐츠 */}
                    {isExpanded && (
                        <div style={{
                            background:'rgba(255,255,255,0.08)',
                            borderRadius:'0 0 16px 16px',
                            padding:'12px',
                            border:'1px solid rgba(255,255,255,0.1)',
                            borderTop:'none'
                        }}>
                            {/* 추가 버튼 */}
                            <button onClick={onAdd} style={{
                                width:'100%',padding:'12px',
                                background: showAddForm ? 'rgba(255,59,48,0.15)' : 'rgba(255,255,255,0.08)',
                                border:'2px dashed rgba(255,255,255,0.2)',
                                borderRadius:'12px',color: showAddForm ? '#ff6b6b' : 'rgba(255,255,255,0.6)',
                                fontSize:'14px',fontWeight:'600',cursor:'pointer',
                                marginBottom:'12px',transition:'all 0.2s'
                            }}>
                                {showAddForm ? '✕ 취소' : `+ ${title} 추가`}
                            </button>
                            
                            {/* 추가 폼 */}
                            {showAddForm && (
                                <div style={{
                                    background:'rgba(255,255,255,0.06)',borderRadius:'12px',
                                    padding:'14px',marginBottom:'12px',
                                    border:'1px solid rgba(255,255,255,0.1)'
                                }}>
                                    <div style={{marginBottom:'10px'}}>
                                        <label style={{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginBottom:'4px',display:'block'}}>날짜</label>
                                        <input type="date" value={addFormData.date}
                                            onChange={e => setAddFormData({...addFormData, date: e.target.value})}
                                            style={{
                                                width:'100%',padding:'10px 12px',borderRadius:'10px',
                                                border:'1px solid rgba(255,255,255,0.15)',
                                                background:'rgba(255,255,255,0.06)',color:'white',
                                                fontSize:'14px',outline:'none'
                                            }}
                                        />
                                    </div>
                                    <div style={{marginBottom:'10px'}}>
                                        <label style={{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginBottom:'4px',display:'block'}}>금액 (원)</label>
                                        <input type="number" value={addFormData.amount}
                                            onChange={e => setAddFormData({...addFormData, amount: e.target.value})}
                                            placeholder="금액 입력"
                                            style={{
                                                width:'100%',padding:'10px 12px',borderRadius:'10px',
                                                border:'1px solid rgba(255,255,255,0.15)',
                                                background:'rgba(255,255,255,0.06)',color:'white',
                                                fontSize:'14px',outline:'none'
                                            }}
                                        />
                                    </div>
                                    <div style={{marginBottom:'12px'}}>
                                        <label style={{fontSize:'12px',color:'rgba(255,255,255,0.5)',marginBottom:'4px',display:'block'}}>메모 (선택)</label>
                                        <input type="text" value={addFormData.memo}
                                            onChange={e => setAddFormData({...addFormData, memo: e.target.value})}
                                            placeholder="메모 입력"
                                            style={{
                                                width:'100%',padding:'10px 12px',borderRadius:'10px',
                                                border:'1px solid rgba(255,255,255,0.15)',
                                                background:'rgba(255,255,255,0.06)',color:'white',
                                                fontSize:'14px',outline:'none'
                                            }}
                                        />
                                    </div>
                                    <button onClick={onAddSubmit} style={{
                                        width:'100%',padding:'12px',borderRadius:'12px',border:'none',
                                        background:`linear-gradient(135deg,${gradientFrom},${gradientTo})`,
                                        color:'white',fontSize:'15px',fontWeight:'700',cursor:'pointer'
                                    }}>추가하기</button>
                                </div>
                            )}
                            
                            {/* 항목 리스트 */}
                            {items.length === 0 ? (
                                <div style={{
                                    textAlign:'center',padding:'20px',
                                    color:'rgba(255,255,255,0.3)',fontSize:'14px'
                                }}>
                                    아직 항목이 없습니다
                                </div>
                            ) : (
                                items.map(item => {
                                    const isEditing = editingItem && editingItem.type === type && editingItem.id === item.id;
                                    
                                    if (isEditing) {
                                        return (
                                            <div key={item.id} style={{
                                                background:'rgba(255,255,255,0.06)',borderRadius:'12px',
                                                padding:'14px',marginBottom:'8px',
                                                border:`1px solid ${color}`
                                            }}>
                                                <div style={{marginBottom:'8px'}}>
                                                    <input type="date" value={editFormData.date}
                                                        onChange={e => setEditFormData({...editFormData, date: e.target.value})}
                                                        style={{
                                                            width:'100%',padding:'8px 10px',borderRadius:'8px',
                                                            border:'1px solid rgba(255,255,255,0.15)',
                                                            background:'rgba(255,255,255,0.06)',color:'white',
                                                            fontSize:'13px',outline:'none'
                                                        }}
                                                    />
                                                </div>
                                                <div style={{marginBottom:'8px'}}>
                                                    <input type="number" value={editFormData.amount}
                                                        onChange={e => setEditFormData({...editFormData, amount: e.target.value})}
                                                        style={{
                                                            width:'100%',padding:'8px 10px',borderRadius:'8px',
                                                            border:'1px solid rgba(255,255,255,0.15)',
                                                            background:'rgba(255,255,255,0.06)',color:'white',
                                                            fontSize:'13px',outline:'none'
                                                        }}
                                                    />
                                                </div>
                                                <div style={{marginBottom:'10px'}}>
                                                    <input type="text" value={editFormData.memo}
                                                        onChange={e => setEditFormData({...editFormData, memo: e.target.value})}
                                                        placeholder="메모"
                                                        style={{
                                                            width:'100%',padding:'8px 10px',borderRadius:'8px',
                                                            border:'1px solid rgba(255,255,255,0.15)',
                                                            background:'rgba(255,255,255,0.06)',color:'white',
                                                            fontSize:'13px',outline:'none'
                                                        }}
                                                    />
                                                </div>
                                                <div style={{display:'flex',gap:'8px'}}>
                                                    <button onClick={onEditCancel} style={{
                                                        flex:1,padding:'8px',borderRadius:'8px',border:'none',
                                                        background:'rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.6)',
                                                        fontSize:'13px',fontWeight:'600',cursor:'pointer'
                                                    }}>취소</button>
                                                    <button onClick={onEditSave} style={{
                                                        flex:1,padding:'8px',borderRadius:'8px',border:'none',
                                                        background:`linear-gradient(135deg,${gradientFrom},${gradientTo})`,
                                                        color:'white',fontSize:'13px',fontWeight:'600',cursor:'pointer'
                                                    }}>저장</button>
                                                </div>
                                            </div>
                                        );
                                    }
                                    
                                    return (
                                        <div key={item.id} style={{
                                            background:'rgba(255,255,255,0.06)',borderRadius:'12px',
                                            padding:'14px',marginBottom:'8px',
                                            border:'1px solid rgba(255,255,255,0.08)',
                                            display:'flex',justifyContent:'space-between',alignItems:'center'
                                        }}>
                                            <div style={{flex:1}}>
                                                <div style={{
                                                    fontSize:'12px',color:'rgba(255,255,255,0.4)',marginBottom:'4px'
                                                }}>
                                                    {formatDate(item.date)}
                                                </div>
                                                <div style={{
                                                    fontSize:'16px',fontWeight:'700',color:'white',marginBottom: item.memo ? '4px' : '0'
                                                }}>
                                                    {formatMoney(item.amount)}
                                                </div>
                                                {item.memo && (
                                                    <div style={{fontSize:'12px',color:'rgba(255,255,255,0.5)'}}>
                                                        {item.memo}
                                                    </div>
                                                )}
                                            </div>
                                            <div style={{display:'flex',gap:'6px'}}>
                                                <button onClick={() => onEdit(item)} style={{
                                                    background:'rgba(255,255,255,0.1)',border:'none',
                                                    color:'rgba(255,255,255,0.6)',padding:'6px 10px',
                                                    borderRadius:'8px',fontSize:'12px',cursor:'pointer'
                                                }}>✏️</button>
                                                <button onClick={() => onDelete(item.id)} style={{
                                                    background:'rgba(255,59,48,0.15)',border:'none',
                                                    color:'#ff6b6b',padding:'6px 10px',
                                                    borderRadius:'8px',fontSize:'12px',cursor:'pointer'
                                                }}>🗑️</button>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    )}
                </div>
            );
        }
        
        // ==================== 렌더 ====================
        ReactDOM.render(<SavingProject />, document.getElementById('root'));
    </script>
</body>
</html>
