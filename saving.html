<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 다솔, 호철 부자되기 프로젝트</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            overflow-x: hidden; background: #e5e7eb;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        #root {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); border-radius: 20px; overflow: hidden;
        }
        @media (max-width: 768px) {
            body { padding: 0; background: white; }
            #root { max-width: 100%; box-shadow: none; border-radius: 0; }
        }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        button { font-family: inherit; cursor: pointer; }
        input, textarea { font-family: inherit; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyCqFjwBKOKRMVkSNOhVeFbl0M0yNfKj7TM",
            authDomain: "dasol-moneybook-2dec7.firebaseapp.com",
            projectId: "dasol-moneybook-2dec7",
            storageBucket: "dasol-moneybook-2dec7.firebasestorage.app",
            messagingSenderId: "998075249498",
            appId: "1:998075249498:web:c4900bdf80094b78b4ed85"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var COLLECTION = 'saving_project';

        var SECTIONS = {
            principal: { title: '원금', emoji: '💵', from: '#11998e', to: '#38ef7d', color: '#11998e' },
            interest:  { title: '이자', emoji: '📈', from: '#f093fb', to: '#f5576c', color: '#f5576c' },
            expense:   { title: '지출', emoji: '💸', from: '#ff6b6b', to: '#ee5a24', color: '#ee5a24' }
        };

        var state = {
            accounts: [],
            activeAccount: '',
            accountData: {},      // { accName: {principal:[],interest:[],expense:[],memo:''} }
            isLoading: true,
            expandedSection: null,
            showAddAccount: false,
            newAccountName: '',
            showSettings: false,
            showAddForm: null,    // type
            addForm: { date: '', amount: '', memo: '' },
            editingItem: null,    // { type, id }
            editForm: { date: '', amount: '', memo: '' },
            memoText: '',
            isMemoEditing: false,
            memoBackup: ''
        };
        var accountListeners = {};
        var accountsLoaded = false;

        function getTodayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function formatMoney(amount) {
            if (amount === 0) return '0원';
            return amount.toLocaleString('ko-KR') + '원';
        }
        function formatDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
        }
        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function docId(name) { return name.replace(/[\/\\]/g, '_'); }

        function getCurrentData() {
            return state.accountData[state.activeAccount] || { principal: [], interest: [], expense: [], memo: '' };
        }

        // ===== 계좌 목록 구독 =====
        db.collection(COLLECTION).doc('accounts').onSnapshot(function (doc) {
            if (doc.exists) {
                var accs = doc.data().list || [];
                state.accounts = accs;
                var lastActive = localStorage.getItem('saving_active_account');
                if (!state.activeAccount) {
                    if (lastActive && accs.indexOf(lastActive) !== -1) state.activeAccount = lastActive;
                    else if (accs.length > 0) state.activeAccount = accs[0];
                } else if (accs.indexOf(state.activeAccount) === -1 && accs.length > 0) {
                    state.activeAccount = accs[0];
                }
            } else {
                var defaults = ['결혼자금남은거', '비상금', '비상금2'];
                db.collection(COLLECTION).doc('accounts').set({ list: defaults });
                state.accounts = defaults;
                state.activeAccount = defaults[0];
            }
            state.isLoading = false;
            subscribeAccounts();
            render();
        }, function (err) {
            console.error('계좌 구독 오류:', err);
            document.getElementById('root').innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:white;text-align:center">' +
                '<div><div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
                '<div style="font-size:16px">데이터를 불러올 수 없습니다.<br>인터넷 연결을 확인해주세요.</div></div></div>';
        });

        // ===== 각 계좌 데이터 구독 (총합산용) =====
        function subscribeAccounts() {
            Object.keys(accountListeners).forEach(function (k) {
                if (accountListeners[k]) accountListeners[k]();
            });
            accountListeners = {};
            state.accounts.forEach(function (accName) {
                var id = docId(accName);
                accountListeners[accName] = db.collection(COLLECTION).doc(id).onSnapshot(function (doc) {
                    if (doc.exists) {
                        state.accountData[accName] = doc.data();
                    } else {
                        state.accountData[accName] = { principal: [], interest: [], expense: [], memo: '' };
                    }
                    if (accName === state.activeAccount && !state.isMemoEditing) {
                        state.memoText = state.accountData[accName].memo || '';
                    }
                    render();
                });
            });
        }

        // ===== 저장 =====
        function saveAccountData(accName, data) {
            var id = docId(accName);
            return db.collection(COLLECTION).doc(id).set(data, { merge: true })
                .catch(function (err) {
                    console.error('저장 실패:', err);
                    alert('저장에 실패했습니다. 인터넷 연결을 확인해주세요.');
                });
        }

        // ===== 총합산 =====
        function totalBalance() {
            return state.accounts.reduce(function (sum, accName) {
                var data = state.accountData[accName] || { principal: [], interest: [], expense: [] };
                var p = (data.principal || []).reduce(function (s, it) { return s + it.amount; }, 0);
                var i = (data.interest || []).reduce(function (s, it) { return s + it.amount; }, 0);
                var e = (data.expense || []).reduce(function (s, it) { return s + it.amount; }, 0);
                return sum + p + i - e;
            }, 0);
        }

        // ===== 계좌 관리 =====
        function setActiveAccount(acc) {
            state.activeAccount = acc;
            state.expandedSection = null;
            state.showAddForm = null;
            state.editingItem = null;
            state.isMemoEditing = false;
            localStorage.setItem('saving_active_account', acc);
            var data = state.accountData[acc];
            state.memoText = data ? (data.memo || '') : '';
            render();
        }
        function addAccount() {
            var name = state.newAccountName.trim();
            if (!name) return;
            if (state.accounts.indexOf(name) !== -1) { alert('이미 존재하는 계좌입니다.'); return; }
            var newList = state.accounts.concat([name]);
            db.collection(COLLECTION).doc('accounts').set({ list: newList });
            state.newAccountName = '';
            state.showAddAccount = false;
            state.activeAccount = name;
            localStorage.setItem('saving_active_account', name);
            render();
        }
        function deleteAccount(accName) {
            if (!confirm('"' + accName + '" 계좌를 삭제하시겠습니까?\n모든 데이터가 삭제됩니다.')) return;
            var newList = state.accounts.filter(function (a) { return a !== accName; });
            db.collection(COLLECTION).doc('accounts').set({ list: newList });
            db.collection(COLLECTION).doc(docId(accName)).delete();
            if (state.activeAccount === accName) state.activeAccount = newList[0] || '';
            render();
        }
        function renameAccount(oldName) {
            var newName = prompt('새 이름을 입력하세요:', oldName);
            if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
            var trimmed = newName.trim();
            if (state.accounts.indexOf(trimmed) !== -1) { alert('이미 존재하는 이름입니다.'); return; }
            var newList = state.accounts.map(function (a) { return a === oldName ? trimmed : a; });
            db.collection(COLLECTION).doc('accounts').set({ list: newList });
            var oldData = state.accountData[oldName];
            if (oldData) {
                db.collection(COLLECTION).doc(docId(trimmed)).set(oldData);
                db.collection(COLLECTION).doc(docId(oldName)).delete();
            }
            if (state.activeAccount === oldName) state.activeAccount = trimmed;
            render();
        }

        // ===== 항목 CRUD =====
        function addItem(type) {
            var f = state.addForm;
            if (!f.date || !f.amount) { alert('날짜와 금액을 입력해주세요.'); return; }
            var cur = getCurrentData();
            var newItem = { id: Date.now().toString(), date: f.date, amount: parseInt(f.amount), memo: f.memo || '' };
            var list = (cur[type] || []).concat([newItem]);
            list.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
            var updated = Object.assign({}, cur); updated[type] = list;
            state.accountData[state.activeAccount] = updated;
            saveAccountData(state.activeAccount, updated);
            state.addForm = { date: '', amount: '', memo: '' };
            state.showAddForm = null;
            render();
        }
        function deleteItem(type, itemId) {
            if (!confirm('삭제하시겠습니까?')) return;
            var cur = getCurrentData();
            var list = (cur[type] || []).filter(function (it) { return it.id !== itemId; });
            var updated = Object.assign({}, cur); updated[type] = list;
            state.accountData[state.activeAccount] = updated;
            saveAccountData(state.activeAccount, updated);
            render();
        }
        function startEdit(type, item) {
            state.editingItem = { type: type, id: item.id };
            state.editForm = { date: item.date, amount: item.amount.toString(), memo: item.memo || '' };
            render();
        }
        function saveEdit() {
            if (!state.editingItem) return;
            var type = state.editingItem.type, id = state.editingItem.id;
            var f = state.editForm;
            if (!f.date || !f.amount) { alert('날짜와 금액을 입력해주세요.'); return; }
            var cur = getCurrentData();
            var list = (cur[type] || []).map(function (it) {
                return it.id === id ? { id: it.id, date: f.date, amount: parseInt(f.amount), memo: f.memo || '' } : it;
            });
            list.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
            var updated = Object.assign({}, cur); updated[type] = list;
            state.accountData[state.activeAccount] = updated;
            saveAccountData(state.activeAccount, updated);
            state.editingItem = null;
            state.editForm = { date: '', amount: '', memo: '' };
            render();
        }
        function cancelEdit() {
            state.editingItem = null;
            state.editForm = { date: '', amount: '', memo: '' };
            render();
        }

        // ===== 메모 (보호 편집) =====
        function startMemoEdit() { state.memoBackup = state.memoText; state.isMemoEditing = true; render(); }
        function saveMemo() {
            var cur = getCurrentData();
            var updated = Object.assign({}, cur); updated.memo = state.memoText;
            state.accountData[state.activeAccount] = updated;
            saveAccountData(state.activeAccount, updated);
            state.isMemoEditing = false;
            render();
        }
        function cancelMemoEdit() { state.memoText = state.memoBackup; state.isMemoEditing = false; render(); }

        // ===== UI 토글/입력 =====
        function toggleSection(type) {
            state.expandedSection = (state.expandedSection === type) ? null : type;
            state.showAddForm = null;
            state.editingItem = null;
            if (type !== 'memo') state.isMemoEditing = false;
            render();
        }
        function toggleAddForm(type) {
            state.showAddForm = (state.showAddForm === type) ? null : type;
            state.addForm = { date: getTodayStr(), amount: '', memo: '' };
            render();
        }
        function onAddField(field, v) { state.addForm[field] = v; }
        function onEditField(field, v) { state.editForm[field] = v; }
        function onMemoInput(v) { state.memoText = v; }
        function onNewAccountName(v) { state.newAccountName = v; }
        function toggleSettings() { state.showSettings = !state.showSettings; render(); }
        function openAddAccount() { state.showAddAccount = true; render(); }
        function closeAddAccount() { state.showAddAccount = false; render(); }

        // ===== 렌더 =====
        function render() {
            var root = document.getElementById('root');
            if (state.isLoading) {
                root.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e)">' +
                    '<div style="text-align:center;color:white"><div style="font-size:48px;margin-bottom:16px">💰</div>' +
                    '<div style="font-size:18px;font-weight:600">로딩중...</div></div></div>';
                return;
            }

            var cur = getCurrentData();
            var principalTotal = (cur.principal || []).reduce(function (s, it) { return s + it.amount; }, 0);
            var interestTotal = (cur.interest || []).reduce(function (s, it) { return s + it.amount; }, 0);
            var expenseTotal = (cur.expense || []).reduce(function (s, it) { return s + it.amount; }, 0);
            var balance = principalTotal + interestTotal - expenseTotal;

            var html = '';

            // 헤더
            html += '<div style="background:linear-gradient(135deg,#667eea,#764ba2);padding:20px 16px 16px;position:sticky;top:0;z-index:100">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
            html += '<a href="index.html" style="color:rgba(255,255,255,0.8);font-size:22px;text-decoration:none">←</a>';
            html += '<h1 style="color:white;font-size:18px;font-weight:700;letter-spacing:-0.5px">💰 다솔, 호철 부자되기 프로젝트</h1>';
            html += '<button onclick="toggleSettings()" style="background:none;border:none;color:rgba(255,255,255,0.8);font-size:20px">⚙️</button>';
            html += '</div>';

            // 전체 합산 잔액
            html += '<div style="text-align:center;padding:10px 0 14px;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:12px">';
            html += '<div style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.6);margin-bottom:4px;letter-spacing:1px">전체 합산 잔액</div>';
            html += '<div style="font-size:24px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.2);letter-spacing:-0.5px">' + formatMoney(totalBalance()) + '</div>';
            html += '</div>';

            // 계좌 탭
            html += '<div class="scrollbar-hide" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">';
            state.accounts.forEach(function (acc) {
                var active = state.activeAccount === acc;
                html += '<button onclick="setActiveAccount(\'' + escapeHtml(acc).replace(/'/g, "\\'") + '\')" style="' +
                    'padding:8px 16px;border-radius:20px;' +
                    'border:' + (active ? '2px solid white' : '2px solid rgba(255,255,255,0.3)') + ';' +
                    'background:' + (active ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)') + ';' +
                    'color:white;font-size:13px;font-weight:' + (active ? '700' : '500') + ';white-space:nowrap">' +
                    escapeHtml(acc) + '</button>';
            });
            html += '<button onclick="openAddAccount()" style="padding:8px 14px;border-radius:20px;border:2px dashed rgba(255,255,255,0.4);background:transparent;color:rgba(255,255,255,0.7);font-size:13px;white-space:nowrap">+ 추가</button>';
            html += '</div>';
            html += '</div>'; // header

            // 설정 패널
            if (state.showSettings) {
                html += '<div style="background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.1);padding:16px">';
                html += '<h3 style="color:white;font-size:15px;font-weight:700;margin-bottom:12px">계좌 관리</h3>';
                state.accounts.forEach(function (acc) {
                    var safe = escapeHtml(acc).replace(/'/g, "\\'");
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,0.08);border-radius:10px;margin-bottom:8px">';
                    html += '<span style="color:white;font-size:14px">' + escapeHtml(acc) + '</span>';
                    html += '<div style="display:flex;gap:8px">';
                    html += '<button onclick="renameAccount(\'' + safe + '\')" style="background:rgba(255,255,255,0.15);border:none;color:white;padding:6px 12px;border-radius:8px;font-size:12px">이름변경</button>';
                    html += '<button onclick="deleteAccount(\'' + safe + '\')" style="background:rgba(255,59,48,0.3);border:none;color:#ff6b6b;padding:6px 12px;border-radius:8px;font-size:12px">삭제</button>';
                    html += '</div></div>';
                });
                html += '</div>';
            }

            // 메인
            html += '<div style="padding:16px">';

            // 요약 카드 4개
            html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">';
            html += summaryCard('통장잔액', balance, '#667eea', '#764ba2');
            html += summaryCard('원금', principalTotal, '#11998e', '#38ef7d');
            html += summaryCard('이자', interestTotal, '#f093fb', '#f5576c');
            html += summaryCard('지출', expenseTotal, '#ff6b6b', '#ee5a24');
            html += '</div>';

            // 아코디언 3개
            html += renderSection('principal', cur);
            html += renderSection('interest', cur);
            html += renderSection('expense', cur);

            // 메모
            html += renderMemo();

            html += '</div>'; // 메인

            // 하단 홈 버튼
            html += '<div style="padding:20px 16px 40px;text-align:center">';
            html += '<a href="index.html" style="display:inline-block;padding:14px 40px;background:rgba(255,255,255,0.1);border-radius:30px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,0.15)">🏠 메인으로</a>';
            html += '</div>';

            // 계좌 추가 모달
            if (state.showAddAccount) {
                html += '<div onclick="closeAddAccount()" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px">';
                html += '<div onclick="event.stopPropagation()" style="background:white;border-radius:20px;padding:24px;width:100%;max-width:350px">';
                html += '<h3 style="font-size:18px;font-weight:700;margin-bottom:16px;color:#1a1a2e">새 계좌 추가</h3>';
                html += '<input id="newAccInput" type="text" placeholder="계좌 이름 (예: 적금, CMA...)" value="' + escapeHtml(state.newAccountName) + '" ' +
                    'oninput="onNewAccountName(this.value)" onkeydown="if(event.key===\'Enter\')addAccount()" ' +
                    'style="width:100%;padding:12px 16px;border-radius:12px;border:2px solid #e5e7eb;font-size:15px;outline:none;margin-bottom:16px">';
                html += '<div style="display:flex;gap:10px">';
                html += '<button onclick="closeAddAccount()" style="flex:1;padding:12px;border-radius:12px;border:none;background:#f3f4f6;color:#666;font-size:15px;font-weight:600">취소</button>';
                html += '<button onclick="addAccount()" style="flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-size:15px;font-weight:600">추가</button>';
                html += '</div></div></div>';
            }

            root.innerHTML = html;

            // 모달 자동 포커스
            if (state.showAddAccount) {
                var inp = document.getElementById('newAccInput');
                if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
            }
        }

        function summaryCard(label, value, from, to) {
            return '<div style="background:linear-gradient(135deg,' + from + ',' + to + ');border-radius:16px;padding:16px 12px;text-align:center">' +
                '<div style="color:rgba(255,255,255,0.7);font-size:11px;font-weight:600;margin-bottom:6px">' + label + '</div>' +
                '<div style="color:white;font-size:17px;font-weight:800;word-break:break-all">' + formatMoney(value) + '</div></div>';
        }

        function renderSection(type, cur) {
            var meta = SECTIONS[type];
            var items = cur[type] || [];
            var isExpanded = state.expandedSection === type;
            var total = items.reduce(function (s, it) { return s + it.amount; }, 0);

            var html = '<div style="margin-bottom:12px">';
            html += '<button onclick="toggleSection(\'' + type + '\')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;' +
                'background:linear-gradient(135deg,' + meta.from + ',' + meta.to + ');' +
                'border-radius:' + (isExpanded ? '16px 16px 0 0' : '16px') + ';border:none">';
            html += '<div style="display:flex;align-items:center;gap:10px">';
            html += '<span style="font-size:20px">' + meta.emoji + '</span>';
            html += '<span style="font-size:16px;font-weight:700;color:white">' + meta.title + '</span>';
            html += '<span style="background:rgba(255,255,255,0.25);padding:2px 8px;border-radius:10px;font-size:12px;color:white;font-weight:600">' + items.length + '건</span>';
            html += '</div>';
            html += '<div style="display:flex;align-items:center;gap:10px">';
            html += '<span style="font-size:14px;font-weight:700;color:white">' + formatMoney(total) + '</span>';
            html += '<span style="font-size:18px;color:white">' + (isExpanded ? '▲' : '▼') + '</span>';
            html += '</div></button>';

            if (isExpanded) {
                html += '<div style="background:rgba(255,255,255,0.08);border-radius:0 0 16px 16px;padding:12px;border:1px solid rgba(255,255,255,0.1);border-top:none">';

                var showForm = state.showAddForm === type;
                html += '<button onclick="toggleAddForm(\'' + type + '\')" style="width:100%;padding:12px;' +
                    'background:' + (showForm ? 'rgba(255,59,48,0.15)' : 'rgba(255,255,255,0.08)') + ';' +
                    'border:2px dashed rgba(255,255,255,0.2);border-radius:12px;' +
                    'color:' + (showForm ? '#ff6b6b' : 'rgba(255,255,255,0.6)') + ';' +
                    'font-size:14px;font-weight:600;margin-bottom:12px">' +
                    (showForm ? '✕ 취소' : '+ ' + meta.title + ' 추가') + '</button>';

                if (showForm) {
                    html += '<div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1)">';
                    html += addFieldRow('날짜', 'date', 'date', state.addForm.date);
                    html += addFieldRow('금액 (원)', 'number', 'amount', state.addForm.amount, '금액 입력');
                    html += addFieldRow('메모 (선택)', 'text', 'memo', state.addForm.memo, '메모 입력');
                    html += '<button onclick="addItem(\'' + type + '\')" style="width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,' + meta.from + ',' + meta.to + ');color:white;font-size:15px;font-weight:700">추가하기</button>';
                    html += '</div>';
                }

                if (items.length === 0) {
                    html += '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3);font-size:14px">아직 항목이 없습니다</div>';
                } else {
                    items.forEach(function (item) {
                        var isEditing = state.editingItem && state.editingItem.type === type && state.editingItem.id === item.id;
                        if (isEditing) {
                            html += '<div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid ' + meta.color + '">';
                            html += editFieldRow('date', 'date', state.editForm.date);
                            html += editFieldRow('number', 'amount', state.editForm.amount);
                            html += editFieldRow('text', 'memo', state.editForm.memo, '메모');
                            html += '<div style="display:flex;gap:8px">';
                            html += '<button onclick="cancelEdit()" style="flex:1;padding:8px;border-radius:8px;border:none;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:13px;font-weight:600">취소</button>';
                            html += '<button onclick="saveEdit()" style="flex:1;padding:8px;border-radius:8px;border:none;background:linear-gradient(135deg,' + meta.from + ',' + meta.to + ');color:white;font-size:13px;font-weight:600">저장</button>';
                            html += '</div></div>';
                        } else {
                            var safeId = String(item.id).replace(/'/g, "\\'");
                            html += '<div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center">';
                            html += '<div style="flex:1">';
                            html += '<div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:4px">' + formatDate(item.date) + '</div>';
                            html += '<div style="font-size:16px;font-weight:700;color:white;margin-bottom:' + (item.memo ? '4px' : '0') + '">' + formatMoney(item.amount) + '</div>';
                            if (item.memo) html += '<div style="font-size:12px;color:rgba(255,255,255,0.5)">' + escapeHtml(item.memo) + '</div>';
                            html += '</div>';
                            html += '<div style="display:flex;gap:6px">';
                            html += '<button onclick="startEdit(\'' + type + '\',{id:\'' + safeId + '\',date:\'' + escapeHtml(item.date) + '\',amount:' + item.amount + ',memo:\'' + escapeHtml(item.memo || '').replace(/'/g, "\\'") + '\'})" style="background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.6);padding:6px 10px;border-radius:8px;font-size:12px">✏️</button>';
                            html += '<button onclick="deleteItem(\'' + type + '\',\'' + safeId + '\')" style="background:rgba(255,59,48,0.15);border:none;color:#ff6b6b;padding:6px 10px;border-radius:8px;font-size:12px">🗑️</button>';
                            html += '</div></div>';
                        }
                    });
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function addFieldRow(label, inputType, field, value, placeholder) {
            var ph = placeholder ? ' placeholder="' + placeholder + '"' : '';
            return '<div style="margin-bottom:10px">' +
                '<label style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:4px;display:block">' + label + '</label>' +
                '<input type="' + inputType + '" value="' + escapeHtml(value) + '"' + ph +
                ' oninput="onAddField(\'' + field + '\',this.value)" ' +
                'style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:white;font-size:14px;outline:none"></div>';
        }
        function editFieldRow(inputType, field, value, placeholder) {
            var ph = placeholder ? ' placeholder="' + placeholder + '"' : '';
            return '<div style="margin-bottom:8px">' +
                '<input type="' + inputType + '" value="' + escapeHtml(value) + '"' + ph +
                ' oninput="onEditField(\'' + field + '\',this.value)" ' +
                'style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:white;font-size:13px;outline:none"></div>';
        }

        function renderMemo() {
            var isExpanded = state.expandedSection === 'memo';
            var html = '<div style="margin-bottom:12px">';
            html += '<button onclick="toggleSection(\'memo\')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;background:linear-gradient(135deg,#ffecd2,#fcb69f);border-radius:' + (isExpanded ? '16px 16px 0 0' : '16px') + ';border:none">';
            html += '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px">📝</span><span style="font-size:16px;font-weight:700;color:#1a1a2e">메모</span></div>';
            html += '<span style="font-size:18px;color:#1a1a2e">' + (isExpanded ? '▲' : '▼') + '</span></button>';

            if (isExpanded) {
                html += '<div style="background:rgba(255,255,255,0.08);border-radius:0 0 16px 16px;padding:16px;border:1px solid rgba(255,255,255,0.1);border-top:none">';
                if (state.isMemoEditing) {
                    html += '<textarea id="memoArea" oninput="onMemoInput(this.value)" placeholder="자유롭게 메모를 작성하세요..." ' +
                        'style="width:100%;min-height:150px;padding:14px;border-radius:12px;border:2px solid #fcb69f;background:rgba(255,255,255,0.1);color:white;font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:inherit">' + escapeHtml(state.memoText) + '</textarea>';
                    html += '<div style="display:flex;gap:10px;margin-top:12px">';
                    html += '<button onclick="cancelMemoEdit()" style="flex:1;padding:12px;border-radius:12px;border:none;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:14px;font-weight:600">취소</button>';
                    html += '<button onclick="saveMemo()" style="flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#ffecd2,#fcb69f);color:#1a1a2e;font-size:14px;font-weight:700">💾 저장</button>';
                    html += '</div>';
                } else {
                    html += '<div style="width:100%;min-height:80px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:white;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word">' +
                        (state.memoText ? escapeHtml(state.memoText) : '<span style="color:rgba(255,255,255,0.3)">메모가 없습니다</span>') + '</div>';
                    html += '<div style="margin-top:12px;text-align:right"><button onclick="startMemoEdit()" style="padding:10px 24px;border-radius:12px;border:none;background:linear-gradient(135deg,#ffecd2,#fcb69f);color:#1a1a2e;font-size:14px;font-weight:700">✏️ 수정</button></div>';
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }
    </script>
</body>
</html>
