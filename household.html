<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 부부 공유 가계부</title>
    
    <!-- Firebase SDK (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow-x: hidden;
            background: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
        }
        
        #root {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border-radius: 20px;
            overflow: hidden;

        @media (max-width: 768px) {
            body {
                padding: 0;
                background: white;
            }
            #root {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
            }
        }
        
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        input[type="date"] {
            min-width: 110px;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        textarea {
            resize: none;
            overflow: hidden;
            min-height: 38px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDOdbB-ImQ6GuqCX1r4bS_miB5IVjD989Y",
            authDomain: "dasol-moneybook-2dec7.firebaseapp.com",
            projectId: "dasol-moneybook-2dec7",
            storageBucket: "dasol-moneybook-2dec7.firebasestorage.app",
            messagingSenderId: "448263372546",
            appId: "1:448263372546:web:67a6508ca09b117e984c1b"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const ChevronDown = ({ size = 24 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            }, React.createElement('polyline', { points: "6 9 12 15 18 9" }))
        );

        const ChevronUp = ({ size = 24 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            }, React.createElement('polyline', { points: "18 15 12 9 6 15" }))
        );

        const Plus = ({ size = 24 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            },
                React.createElement('line', { x1: "12", y1: "5", x2: "12", y2: "19" }),
                React.createElement('line', { x1: "5", y1: "12", x2: "19", y2: "12" })
            )
        );

        const Trash2 = ({ size = 20 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            },
                React.createElement('polyline', { points: "3 6 5 6 21 6" }),
                React.createElement('path', { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" }),
                React.createElement('line', { x1: "10", y1: "11", x2: "10", y2: "17" }),
                React.createElement('line', { x1: "14", y1: "11", x2: "14", y2: "17" })
            )
        );

        const Settings = ({ size = 20 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            },
                React.createElement('circle', { cx: "12", cy: "12", r: "3" }),
                React.createElement('path', { d: "M12 1v6m0 6v6m-5-7l5-5m0 10l5-5m-10-5l5 5m0 0l5-5m-10 10l5-5m0 0l5 5" })
            )
        );

        const Edit = ({ size = 16 }) => (
            React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none",
                stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"
            },
                React.createElement('path', { d: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" }),
                React.createElement('path', { d: "M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" })
            )
        );

        function Household() {
            const [activeMonth, setActiveMonth] = useState('');
            const [monthData, setMonthData] = useState({});
            const [isFixedExpanded, setIsFixedExpanded] = useState(false);
            const [isExpenseExpanded, setIsExpenseExpanded] = useState(false);
            const [isIncomeExpanded, setIsIncomeExpanded] = useState(false);
            const [isRefundExpanded, setIsRefundExpanded] = useState(false);
            const [isSavingExpanded, setIsSavingExpanded] = useState(false);
            const [months, setMonths] = useState([]);
            const [showMonthManage, setShowMonthManage] = useState(false);
            const [newMonthYear, setNewMonthYear] = useState('25');
            const [newMonthMonth, setNewMonthMonth] = useState('01');
            const [editingItems, setEditingItems] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [localData, setLocalData] = useState({});
            const [editingMonth, setEditingMonth] = useState(null);
            const [editMonthYear, setEditMonthYear] = useState('');
            const [editMonthMonth, setEditMonthMonth] = useState('');
            const saveTimeoutRef = useRef({});

            useEffect(() => {
                const unsubscribe = db.collection('household').onSnapshot((snapshot) => {
                    const data = {};
                    const monthsList = [];
                    
                    snapshot.forEach((doc) => {
                        const monthName = doc.id;
                        monthsList.push(monthName);
                        const docData = doc.data();
                        data[monthName] = {
                            ...docData,
                            refund: docData.refund || [],
                            saving: docData.saving || []
                        };
                    });

                    if (monthsList.length === 0) {
                        const initialMonths = ['25년11월', '25년12월', '26년01월'];
                        const initialData = {
                            fixed: [],
                            expense: [],
                            income: [],
                            refund: [],
                            saving: []
                        };

                        initialMonths.forEach(month => {
                            db.collection('household').doc(month).set(initialData);
                        });
                    } else {
                        monthsList.sort((a, b) => {
                            const [aYear, aMonth] = a.replace('년', '-').replace('월', '').split('-');
                            const [bYear, bMonth] = b.replace('년', '-').replace('월', '').split('-');
                            return parseInt(bYear + bMonth) - parseInt(aYear + aMonth);
                        });

                        setMonths(monthsList);
                        setMonthData(data);
                        setLocalData(data);
                        
                        if (!activeMonth) {
                            const savedMonth = localStorage.getItem('lastActiveMonth');
                            if (savedMonth && monthsList.includes(savedMonth)) {
                                setActiveMonth(savedMonth);
                            } else {
                                setActiveMonth(monthsList[0]);
                            }
                        }
                        
                        setIsLoading(false);
                    }
                });

                const handleBeforeUnload = () => {
                    Object.keys(saveTimeoutRef.current).forEach(key => {
                        if (saveTimeoutRef.current[key]) {
                            clearTimeout(saveTimeoutRef.current[key]);
                        }
                    });
                    
                    if (localData[activeMonth]) {
                        db.collection('household').doc(activeMonth).update(localData[activeMonth]);
                    }
                };

                window.addEventListener('beforeunload', handleBeforeUnload);

                return () => {
                    unsubscribe();
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                };
            }, []);

            const currentData = localData[activeMonth] || { fixed: [], expense: [], income: [], refund: [], saving: [] };

            const sortByDate = (items, type) => {
                const hasEditing = items.some(item => editingItems[`${type}-${item.id}`]);
                if (hasEditing) return items;
                
                return [...items].sort((a, b) => {
                    if (!a.date && !b.date) return 0;
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    return new Date(a.date) - new Date(b.date);
                });
            };

            const formatNumber = (num) => {
                if (!num) return '0';
                return parseInt(num).toLocaleString('ko-KR');
            };

            const calculateTotal = (items) => {
                return items.reduce((sum, item) => sum + (parseInt(item.amount) || 0), 0);
            };

            const saveToFirebase = (field, updatedData) => {
                const key = `${activeMonth}-${field}`;
                if (saveTimeoutRef.current[key]) {
                    clearTimeout(saveTimeoutRef.current[key]);
                }
                saveTimeoutRef.current[key] = setTimeout(() => {
                    db.collection('household').doc(activeMonth).update({ [field]: updatedData })
                        .then(() => console.log('저장 완료'))
                        .catch(err => console.error('저장 실패:', err));
                }, 500);
            };

            const addMonth = () => {
                const monthFormatted = newMonthMonth.toString().padStart(2, '0');
                const newMonth = `${newMonthYear}년${monthFormatted}월`;
                if (!months.includes(newMonth)) {
                    db.collection('household').doc(newMonth).set({
                        fixed: [], expense: [], income: [], refund: [], saving: []
                    });
                    setNewMonthYear('25');
                    setNewMonthMonth('01');
                }
            };

            const startEditMonth = (month) => {
                const [year, monthPart] = month.replace('년', '-').replace('월', '').split('-');
                setEditingMonth(month);
                setEditMonthYear(year);
                setEditMonthMonth(monthPart);
            };

            const saveEditMonth = async () => {
                if (!editingMonth) return;
                const monthFormatted = editMonthMonth.toString().padStart(2, '0');
                const newMonthName = `${editMonthYear}년${monthFormatted}월`;
                if (newMonthName === editingMonth) { setEditingMonth(null); return; }
                if (months.includes(newMonthName)) { alert('이미 존재하는 월입니다.'); return; }
                try {
                    const oldData = localData[editingMonth];
                    await db.collection('household').doc(newMonthName).set(oldData);
                    await db.collection('household').doc(editingMonth).delete();
                    if (activeMonth === editingMonth) {
                        setActiveMonth(newMonthName);
                        localStorage.setItem('lastActiveMonth', newMonthName);
                    }
                    setEditingMonth(null);
                } catch (error) {
                    console.error('월 이름 수정 실패:', error);
                    alert('월 이름 수정에 실패했습니다.');
                }
            };

            const cancelEditMonth = () => {
                setEditingMonth(null);
                setEditMonthYear('');
                setEditMonthMonth('');
            };

            const changeMonth = (newMonth) => {
                if (localData[activeMonth]) {
                    Object.keys(saveTimeoutRef.current).forEach(key => {
                        if (saveTimeoutRef.current[key]) clearTimeout(saveTimeoutRef.current[key]);
                    });
                    db.collection('household').doc(activeMonth).update(localData[activeMonth])
                        .then(() => console.log('월 변경 전 저장 완료'))
                        .catch(err => console.error('저장 실패:', err));
                }
                setActiveMonth(newMonth);
                localStorage.setItem('lastActiveMonth', newMonth);
            };

            const deleteMonth = (month) => {
                if (months.length <= 1) { alert('마지막 월은 삭제할 수 없습니다.'); return; }
                if (window.confirm(`${month}을 삭제하시겠습니까?`)) {
                    db.collection('household').doc(month).delete();
                    if (activeMonth === month) {
                        const index = months.indexOf(month);
                        const newActiveMonth = months[index === 0 ? 1 : index - 1];
                        setActiveMonth(newActiveMonth);
                        localStorage.setItem('lastActiveMonth', newActiveMonth);
                    }
                }
            };

            // 공통 CRUD 함수들
            const addItem = (field) => {
                const newItem = { id: Date.now(), date: '', content: '', amount: '' };
                const updated = [...(currentData[field] || []), newItem];
                setLocalData({ ...localData, [activeMonth]: { ...currentData, [field]: updated } });
                db.collection('household').doc(activeMonth).update({ [field]: updated });
                setEditingItems({ ...editingItems, [`${field}-${newItem.id}`]: true });
            };

            const updateItem = (field, id, key, value) => {
                const updated = (currentData[field] || []).map(item =>
                    item.id === id ? { ...item, [key]: value } : item
                );
                setLocalData({ ...localData, [activeMonth]: { ...currentData, [field]: updated } });
                saveToFirebase(field, updated);
            };

            const deleteItem = (field, id) => {
                if (window.confirm('삭제하시겠습니까?')) {
                    const updated = (currentData[field] || []).filter(item => item.id !== id);
                    setLocalData({ ...localData, [activeMonth]: { ...currentData, [field]: updated } });
                    db.collection('household').doc(activeMonth).update({ [field]: updated });
                }
            };

            const toggleEdit = (type, id) => {
                const key = `${type}-${id}`;
                setEditingItems({ ...editingItems, [key]: !editingItems[key] });
            };

            const completeEdit = (type, id) => {
                const key = `${type}-${id}`;
                const timeoutKey = `${activeMonth}-${type}`;
                if (saveTimeoutRef.current[timeoutKey]) clearTimeout(saveTimeoutRef.current[timeoutKey]);
                const fieldData = currentData[type];
                db.collection('household').doc(activeMonth).update({ [type]: fieldData })
                    .then(() => console.log('즉시 저장 완료'))
                    .catch(err => console.error('저장 실패:', err));
                setEditingItems({ ...editingItems, [key]: false });
            };

            const fixedTotal = calculateTotal(currentData.fixed);
            const expenseTotal = calculateTotal(currentData.expense);
            const incomeTotal = calculateTotal(currentData.income);
            const refundTotal = calculateTotal(currentData.refund || []);
            const savingTotal = calculateTotal(currentData.saving || []);
            const totalExpenseWithRefund = fixedTotal + expenseTotal - refundTotal;
            // 저금은 통장잔액에서만 차감, 지출합계/수입합계에는 미포함
            const balance = incomeTotal + refundTotal - fixedTotal - expenseTotal - savingTotal;

            if (isLoading) {
                return (
                    <div className="flex items-center justify-center h-screen bg-gray-50">
                        <div className="text-center">
                            <div className="text-4xl mb-4">💰</div>
                            <div className="text-xl font-bold text-gray-700">로딩 중...</div>
                        </div>
                    </div>
                );
            }

            // 섹션 렌더링 공통 함수
            const renderSection = (field, label, emoji, colorClass, bgClass, borderClass, isExpanded, setExpanded) => {
                const items = currentData[field] || [];
                return (
                    <div className="bg-white shadow-lg rounded-2xl mb-3 overflow-hidden">
                        <button
                            onClick={() => setExpanded(!isExpanded)}
                            className={`w-full px-4 py-3 flex items-center justify-between ${colorClass} text-white transition-colors`}
                        >
                            <span className="text-lg font-bold">{emoji} {label}</span>
                            {isExpanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                        </button>

                        {isExpanded && (
                            <div className="p-3">
                                <div className="space-y-2">
                                    {items.length === 0 ? (
                                        <div className="text-center py-8 text-gray-400 text-sm">
                                            {label} 내역이 없습니다
                                        </div>
                                    ) : (
                                        sortByDate(items, field).map(item => {
                                            const isEditing = editingItems[`${field}-${item.id}`];
                                            return (
                                                <div key={item.id} className={`${bgClass} p-2 rounded-lg border ${borderClass}`}>
                                                    <div className="flex gap-1 items-start mb-2">
                                                        <input
                                                            type="date"
                                                            value={item.date || ''}
                                                            onChange={(e) => updateItem(field, item.id, 'date', e.target.value)}
                                                            className="w-28 px-1 py-2 border rounded text-xs flex-shrink-0"
                                                            disabled={!isEditing}
                                                        />
                                                        <button
                                                            onClick={() => deleteItem(field, item.id)}
                                                            className="p-2 text-red-500 hover:bg-red-50 rounded flex-shrink-0"
                                                        >
                                                            <Trash2 size={16} />
                                                        </button>
                                                    </div>
                                                    <input
                                                        type="text"
                                                        value={item.content || ''}
                                                        onChange={(e) => updateItem(field, item.id, 'content', e.target.value)}
                                                        placeholder="내용을 입력하세요"
                                                        className="w-full px-2 py-2 border rounded text-sm mb-2"
                                                        disabled={!isEditing}
                                                    />
                                                    <div className="flex gap-1 items-center">
                                                        {isEditing ? (
                                                            <input
                                                                type="number"
                                                                value={item.amount || ''}
                                                                onChange={(e) => updateItem(field, item.id, 'amount', e.target.value)}
                                                                placeholder="금액"
                                                                className="flex-1 px-2 py-2 border rounded text-sm"
                                                            />
                                                        ) : (
                                                            <div className="flex-1 px-2 py-2 border rounded bg-gray-100 text-xs font-bold text-right">
                                                                {formatNumber(item.amount)}원
                                                            </div>
                                                        )}
                                                        <button
                                                            onClick={() => isEditing ? completeEdit(field, item.id) : toggleEdit(field, item.id)}
                                                            className={`px-4 py-2 rounded font-bold text-xs ${
                                                                isEditing ? 'bg-green-500 text-white' : 'bg-blue-500 text-white'
                                                            }`}
                                                        >
                                                            {isEditing ? '완료' : '수정'}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                                <button
                                    onClick={() => addItem(field)}
                                    className={`mt-3 w-full flex items-center justify-center gap-2 px-4 py-3 ${colorClass} text-white rounded-lg font-bold`}
                                >
                                    <Plus size={20} />
                                    {label} 추가
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="sticky top-0 bg-gradient-to-r from-purple-600 to-blue-600 text-white shadow-lg z-20">
                        <div className="px-4 py-4">
                            <div className="flex items-center justify-between mb-3">
                                <h1 className="text-2xl font-bold">💰 부부 공유 가계부</h1>
                                <button
                                    onClick={() => setShowMonthManage(!showMonthManage)}
                                    className="p-2 bg-white bg-opacity-20 rounded-lg hover:bg-opacity-30 transition-colors"
                                >
                                    <Settings size={20} />
                                </button>
                            </div>
                            
                            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                {months.map(month => (
                                    <button
                                        key={month}
                                        onClick={() => changeMonth(month)}
                                        className={`flex-shrink-0 px-4 py-2 rounded-lg font-bold text-sm transition-all ${
                                            activeMonth === month
                                                ? 'bg-white text-purple-600 shadow-lg scale-105'
                                                : 'bg-purple-700 hover:bg-purple-800'
                                        }`}
                                    >
                                        {month}
                                    </button>
                                ))}
                            </div>

                            {showMonthManage && (
                                <div className="mt-3 p-4 bg-white rounded-lg text-black">
                                    <h3 className="font-bold mb-3 text-lg">월 관리</h3>
                                    
                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2">새 월 추가</label>
                                        <div className="flex gap-2 items-center">
                                            <input type="number" value={newMonthYear} onChange={(e) => setNewMonthYear(e.target.value)} onFocus={(e) => e.target.select()} placeholder="년" className="w-20 px-3 py-2 border rounded-lg text-center" />
                                            <span className="font-bold">년</span>
                                            <input type="number" value={newMonthMonth} onChange={(e) => setNewMonthMonth(e.target.value)} onFocus={(e) => e.target.select()} placeholder="월" min="1" max="12" className="w-20 px-3 py-2 border rounded-lg text-center" />
                                            <span className="font-bold">월</span>
                                            <button onClick={addMonth} className="flex-1 px-4 py-2 bg-green-500 text-white rounded-lg font-bold hover:bg-green-600">추가</button>
                                        </div>
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2">월 이름 수정</label>
                                        <div className="space-y-2 max-h-60 overflow-y-auto">
                                            {months.map(month => (
                                                <div key={month} className="p-2 bg-gray-50 rounded">
                                                    {editingMonth === month ? (
                                                        <div className="space-y-2">
                                                            <div className="flex gap-2 items-center">
                                                                <input type="number" value={editMonthYear} onChange={(e) => setEditMonthYear(e.target.value)} onFocus={(e) => e.target.select()} placeholder="년" className="w-20 px-2 py-2 border rounded text-center" />
                                                                <span className="font-bold">년</span>
                                                                <input type="number" value={editMonthMonth} onChange={(e) => setEditMonthMonth(e.target.value)} onFocus={(e) => e.target.select()} placeholder="월" min="1" max="12" className="w-20 px-2 py-2 border rounded text-center" />
                                                                <span className="font-bold">월</span>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={saveEditMonth} className="flex-1 px-3 py-2 bg-green-500 text-white rounded text-sm font-bold hover:bg-green-600">저장</button>
                                                                <button onClick={cancelEditMonth} className="flex-1 px-3 py-2 bg-gray-500 text-white rounded text-sm font-bold hover:bg-gray-600">취소</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex items-center justify-between">
                                                            <span className="font-medium">{month}</span>
                                                            <button onClick={() => startEditMonth(month)} className="px-3 py-1 bg-blue-500 text-white rounded text-sm hover:bg-blue-600 flex items-center gap-1">
                                                                <Edit size={14} /> 수정
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold mb-2">월 삭제</label>
                                        <div className="space-y-2 max-h-40 overflow-y-auto">
                                            {months.map(month => (
                                                <div key={month} className="flex items-center justify-between p-2 bg-gray-50 rounded">
                                                    <span className="font-medium">{month}</span>
                                                    <button onClick={() => deleteMonth(month)} className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600">삭제</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <button onClick={() => setShowMonthManage(false)} className="mt-4 w-full px-4 py-2 bg-gray-500 text-white rounded-lg font-bold hover:bg-gray-600">닫기</button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="p-3">
                        <div className="grid grid-cols-3 gap-2 mb-3">
                            <div className="bg-green-100 rounded-xl p-3 shadow-lg border-2 border-green-200">
                                <div className="text-xs font-bold mb-1 text-green-800">통장잔액</div>
                                <div className="text-sm font-bold break-words leading-tight text-green-700">{formatNumber(balance)}원</div>
                            </div>
                            <div className="bg-red-100 rounded-xl p-3 shadow-lg border-2 border-red-200">
                                <div className="text-xs font-bold mb-1 text-red-800">지출합계</div>
                                <div className="text-sm font-bold break-words leading-tight text-red-700">{formatNumber(totalExpenseWithRefund)}원</div>
                            </div>
                            <div className="bg-blue-100 rounded-xl p-3 shadow-lg border-2 border-blue-200">
                                <div className="text-xs font-bold mb-1 text-blue-800">수입합계</div>
                                <div className="text-sm font-bold break-words leading-tight text-blue-700">{formatNumber(incomeTotal)}원</div>
                            </div>
                        </div>

                        {renderSection('fixed', '고정지출', '🏠', 'bg-purple-600 hover:bg-purple-700', 'bg-purple-50', 'border-purple-200', isFixedExpanded, setIsFixedExpanded)}
                        {renderSection('expense', '지출', '💸', 'bg-red-600 hover:bg-red-700', 'bg-red-50', 'border-red-200', isExpenseExpanded, setIsExpenseExpanded)}
                        {renderSection('income', '수입', '💵', 'bg-blue-600 hover:bg-blue-700', 'bg-blue-50', 'border-blue-200', isIncomeExpanded, setIsIncomeExpanded)}
                        {renderSection('refund', '환불', '💳', 'bg-yellow-600 hover:bg-yellow-700', 'bg-yellow-50', 'border-yellow-200', isRefundExpanded, setIsRefundExpanded)}
                        {renderSection('saving', '저금', '🐷', 'bg-teal-600 hover:bg-teal-700', 'bg-teal-50', 'border-teal-200', isSavingExpanded, setIsSavingExpanded)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Household />);
    </script>
</body>
</html>
