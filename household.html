<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 부부 공유 가계부</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            overflow-x: hidden; background: #e5e7eb;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        #root {
            width: 100%; max-width: 430px; min-height: 100vh; background: #f9fafb;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); border-radius: 20px; overflow: hidden;
        }
        @media (max-width: 768px) {
            body { padding: 0; background: white; }
            #root { max-width: 100%; box-shadow: none; border-radius: 0; }
        }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="date"] { min-width: 110px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        button { font-family: inherit; cursor: pointer; border: none; }
        input { font-family: inherit; }
        .loading-screen {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background: #f9fafb;
        }
        .loading-screen .emoji { font-size: 40px; margin-bottom: 16px; }
        .loading-screen .txt { font-size: 20px; font-weight: bold; color: #374151; text-align: center; }
        .header {
            position: sticky; top: 0; z-index: 20;
            background: linear-gradient(to right, #9333ea, #2563eb);
            color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 16px;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .header-top a.back { color: rgba(255,255,255,0.85); font-size: 22px; text-decoration: none; }
        .header-top h1 { font-size: 20px; font-weight: bold; }
        .icon-btn {
            padding: 8px; background: rgba(255,255,255,0.2); border-radius: 8px;
            color: white; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.3); }
        .month-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
        .month-tab {
            flex-shrink: 0; padding: 8px 16px; border-radius: 8px;
            font-weight: bold; font-size: 14px; transition: all 0.2s;
            background: #7e22ce; color: white;
        }
        .month-tab:hover { background: #6b21a8; }
        .month-tab.active { background: white; color: #9333ea; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transform: scale(1.05); }
        .manage-panel { margin-top: 12px; padding: 16px; background: white; border-radius: 8px; color: black; }
        .manage-panel h3 { font-weight: bold; margin-bottom: 12px; font-size: 18px; }
        .manage-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .manage-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
        .num-input { width: 70px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; text-align: center; }
        .month-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 16px; }
        .month-list-item { padding: 8px; background: #f9fafb; border-radius: 6px; }
        .month-list-row { display: flex; align-items: center; justify-content: space-between; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: bold; color: white; font-size: 14px; }
        .btn-green { background: #22c55e; } .btn-green:hover { background: #16a34a; }
        .btn-gray { background: #6b7280; } .btn-gray:hover { background: #4b5563; }
        .btn-blue { background: #3b82f6; } .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
        .btn-sm { padding: 4px 12px; font-size: 14px; }
        .content { padding: 12px; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .summary-card { border-radius: 12px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid; }
        .summary-card .label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .summary-card .value { font-size: 14px; font-weight: bold; word-break: break-word; line-height: 1.25; }
        .sc-green { background: #dcfce7; border-color: #bbf7d0; }
        .sc-green .label { color: #166534; } .sc-green .value { color: #15803d; }
        .sc-red { background: #fee2e2; border-color: #fecaca; }
        .sc-red .label { color: #991b1b; } .sc-red .value { color: #b91c1c; }
        .sc-blue { background: #dbeafe; border-color: #bfdbfe; }
        .sc-blue .label { color: #1e40af; } .sc-blue .value { color: #1d4ed8; }
        .section { background: white; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
        .section-header {
            width: 100%; padding: 12px 16px; display: flex; align-items: center;
            justify-content: space-between; color: white; transition: background 0.2s;
        }
        .section-header span.title { font-size: 18px; font-weight: bold; }
        .sh-purple { background: #9333ea; } .sh-purple:hover { background: #7e22ce; }
        .sh-red { background: #dc2626; } .sh-red:hover { background: #b91c1c; }
        .sh-blue { background: #2563eb; } .sh-blue:hover { background: #1d4ed8; }
        .sh-yellow { background: #ca8a04; } .sh-yellow:hover { background: #a16207; }
        .sh-teal { background: #0d9488; } .sh-teal:hover { background: #0f766e; }
        .section-body { padding: 12px; }
        .item-list { display: flex; flex-direction: column; gap: 8px; }
        .empty { text-align: center; padding: 32px 0; color: #9ca3af; font-size: 14px; }
        .item {
            padding: 8px; border-radius: 8px; border: 1px solid;
        }
        .ib-purple { background: #faf5ff; border-color: #e9d5ff; }
        .ib-red { background: #fef2f2; border-color: #fecaca; }
        .ib-blue { background: #eff6ff; border-color: #bfdbfe; }
        .ib-yellow { background: #fefce8; border-color: #fef08a; }
        .ib-teal { background: #f0fdfa; border-color: #99f6e4; }
        .item-top { display: flex; gap: 4px; align-items: flex-start; margin-bottom: 8px; }
        .item-date { width: 130px; padding: 8px 4px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; flex-shrink: 0; }
        .item-date:disabled { background: #f3f4f6; color: #6b7280; }
        .del-btn { padding: 8px; color: #ef4444; border-radius: 4px; background: none; flex-shrink: 0; }
        .del-btn:hover { background: #fef2f2; }
        .item-content { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
        .item-content:disabled { background: #f3f4f6; color: #6b7280; }
        .item-amount-row { display: flex; gap: 4px; align-items: center; }
        .item-amount-input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; }
        .item-amount-view { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; background: #f3f4f6; font-size: 12px; font-weight: bold; text-align: right; }
        .edit-btn { padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 12px; color: white; }
        .edit-btn.editing { background: #22c55e; } .edit-btn.normal { background: #3b82f6; }
        .add-btn {
            margin-top: 12px; width: 100%; display: flex; align-items: center;
            justify-content: center; gap: 8px; padding: 12px; color: white;
            border-radius: 8px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="root"><div class="loading-screen"><div style="text-align:center"><div class="emoji">💰</div><div class="txt">로딩 중...</div></div></div></div>
    <input type="file" id="restoreFileInput" accept=".json,application/json" style="display:none" onchange="restoreData(event)">
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyDOdbB-ImQ6GuqCX1r4bS_miB5IVjD989Y",
            authDomain: "dasol-moneybook-2dec7.firebaseapp.com",
            projectId: "dasol-moneybook-2dec7",
            storageBucket: "dasol-moneybook-2dec7.firebasestorage.app",
            messagingSenderId: "448263372546",
            appId: "1:448263372546:web:67a6508ca09b117e984c1b"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var FIELDS = ['fixed', 'expense', 'income', 'refund', 'saving'];
        var SECTION_META = {
            fixed:   { label: '고정지출', emoji: '🏠', sh: 'sh-purple', ib: 'ib-purple' },
            expense: { label: '지출',     emoji: '💸', sh: 'sh-red',    ib: 'ib-red' },
            income:  { label: '수입',     emoji: '💵', sh: 'sh-blue',   ib: 'ib-blue' },
            refund:  { label: '환불',     emoji: '💳', sh: 'sh-yellow', ib: 'ib-yellow' },
            saving:  { label: '저금',     emoji: '🐷', sh: 'sh-teal',   ib: 'ib-teal' }
        };
        // ===== 상태 =====
        var state = {
            activeMonth: '',
            months: [],
            localData: {},        // 화면에 그리는 데이터 (로컬 우선)
            firebaseData: {},     // Firebase 원본
            expanded: { fixed: false, expense: false, income: false, refund: false, saving: false },
            editingItems: {},     // key: "type-id" -> true
            showMonthManage: false,
            newMonthYear: '25',
            newMonthMonth: '01',
            editingMonth: null,
            editMonthYear: '',
            editMonthMonth: '',
            isLoading: true
        };
        var saveTimeouts = {};    // race condition 방지용 pending 저장 타이머
        function hasPendingSave(month, field) {
            return !!saveTimeouts[month + '-' + field];
        }
        function formatNumber(num) {
            if (!num) return '0';
            return parseInt(num).toLocaleString('ko-KR');
        }
        function calcTotal(items) {
            return (items || []).reduce(function (s, it) { return s + (parseInt(it.amount) || 0); }, 0);
        }
        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        // ===== Firebase 구독 =====
        db.collection('household').onSnapshot(function (snapshot) {
            var data = {};
            var monthsList = [];
            snapshot.forEach(function (doc) {
                monthsList.push(doc.id);
                var d = doc.data();
                d.refund = d.refund || [];
                d.saving = d.saving || [];
                data[doc.id] = d;
            });
            if (monthsList.length === 0) {
                var initialMonths = ['25년11월', '25년12월', '26년01월'];
                var initialData = { fixed: [], expense: [], income: [], refund: [], saving: [] };
                initialMonths.forEach(function (m) {
                    db.collection('household').doc(m).set(initialData);
                });
                return;
            }
            monthsList.sort(function (a, b) {
                var pa = a.replace('년', '-').replace('월', '').split('-');
                var pb = b.replace('년', '-').replace('월', '').split('-');
                return parseInt(pb[0] + pb[1]) - parseInt(pa[0] + pa[1]);
            });
            state.months = monthsList;
            state.firebaseData = data;
            // ★ smart merge: pending 저장이 있는 필드는 Firebase 데이터로 덮어쓰지 않음
            var prev = state.localData;
            var merged = {};
            monthsList.forEach(function (month) {
                if (!prev[month]) {
                    merged[month] = data[month];
                } else {
                    merged[month] = {};
                    FIELDS.forEach(function (field) {
                        if (hasPendingSave(month, field)) {
                            merged[month][field] = prev[month][field];
                        } else {
                            merged[month][field] = data[month][field];
                        }
                    });
                }
            });
            state.localData = merged;
            if (!state.activeMonth) {
                var saved = localStorage.getItem('lastActiveMonth');
                state.activeMonth = (saved && monthsList.indexOf(saved) !== -1) ? saved : monthsList[0];
            } else if (monthsList.indexOf(state.activeMonth) === -1) {
                state.activeMonth = monthsList[0];
            }
            state.isLoading = false;
            safeRender();
        }, function (err) {
            console.error('구독 오류:', err);
            document.getElementById('root').innerHTML =
                '<div class="loading-screen"><div style="text-align:center"><div class="emoji">⚠️</div>' +
                '<div class="txt">데이터를 불러올 수 없습니다.<br>인터넷 연결을 확인해주세요.</div></div></div>';
        });
        window.addEventListener('beforeunload', function () {
            Object.keys(saveTimeouts).forEach(function (key) {
                if (saveTimeouts[key]) { clearTimeout(saveTimeouts[key]); saveTimeouts[key] = null; }
            });
            var month = state.activeMonth;
            if (month && state.localData[month]) {
                db.collection('household').doc(month).update(state.localData[month]);
            }
        });
        function getCurrentData() {
            return state.localData[state.activeMonth] || { fixed: [], expense: [], income: [], refund: [], saving: [] };
        }
        // 항상 날짜순으로 정렬한다.
        // (날짜가 없는 항목 - 새로 추가한 빈 항목 - 은 맨 아래로 보낸다.)
        function sortByDate(items, type) {
            return items.slice().sort(function (a, b) {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });
        }
        // ===== 저장 (디바운스 + pending 보호) =====
        function saveToFirebase(field, updatedData) {
            var key = state.activeMonth + '-' + field;
            if (saveTimeouts[key]) clearTimeout(saveTimeouts[key]);
            saveTimeouts[key] = setTimeout(function () {
                var update = {};
                update[field] = updatedData;
                db.collection('household').doc(state.activeMonth).update(update)
                    .then(function () { saveTimeouts[key] = null; })
                    .catch(function (err) { console.error('저장 실패:', err); saveTimeouts[key] = null; });
            }, 500);
        }
        // ===== 항목 CRUD =====
        function addItem(type) {
            var cur = getCurrentData();
            var newItem = { id: Date.now(), date: '', content: '', amount: '' };
            var updated = (cur[type] || []).concat([newItem]);
            cur[type] = updated;
            state.localData[state.activeMonth] = cur;
            var update = {}; update[type] = updated;
            db.collection('household').doc(state.activeMonth).update(update);
            state.editingItems[type + '-' + newItem.id] = true;
            render();
        }
        function updateItem(type, id, field, value) {
            var cur = getCurrentData();
            var updated = (cur[type] || []).map(function (it) {
                if (it.id === id) { var c = Object.assign({}, it); c[field] = value; return c; }
                return it;
            });
            cur[type] = updated;
            state.localData[state.activeMonth] = cur;
            saveToFirebase(type, updated);
            // 입력 중에는 전체 재렌더링하지 않음 (포커스 유지). 값만 메모리에 반영.
        }
        function deleteItem(type, id) {
            if (!confirm('삭제하시겠습니까?')) return;
            var cur = getCurrentData();
            var updated = (cur[type] || []).filter(function (it) { return it.id !== id; });
            cur[type] = updated;
            state.localData[state.activeMonth] = cur;
            var update = {}; update[type] = updated;
            db.collection('household').doc(state.activeMonth).update(update);
            render();
        }
        function toggleEdit(type, id) {
            var key = type + '-' + id;
            state.editingItems[key] = !state.editingItems[key];
            render();
        }
        function completeEdit(type, id) {
            var key = type + '-' + id;
            var timeoutKey = state.activeMonth + '-' + type;
            if (saveTimeouts[timeoutKey]) { clearTimeout(saveTimeouts[timeoutKey]); saveTimeouts[timeoutKey] = null; }
            var cur = getCurrentData();
            var update = {}; update[type] = cur[type];
            db.collection('household').doc(state.activeMonth).update(update)
                .catch(function (err) { console.error('저장 실패:', err); });
            state.editingItems[key] = false;
            render();
        }
        // ===== 월 관리 =====
        function changeMonth(newMonth) {
            if (state.localData[state.activeMonth]) {
                Object.keys(saveTimeouts).forEach(function (key) {
                    if (saveTimeouts[key]) { clearTimeout(saveTimeouts[key]); saveTimeouts[key] = null; }
                });
                db.collection('household').doc(state.activeMonth).update(state.localData[state.activeMonth])
                    .catch(function (err) { console.error('저장 실패:', err); });
            }
            state.activeMonth = newMonth;
            localStorage.setItem('lastActiveMonth', newMonth);
            render();
        }
        function addMonth() {
            var mm = String(state.newMonthMonth).padStart(2, '0');
            var newMonth = state.newMonthYear + '년' + mm + '월';
            if (state.months.indexOf(newMonth) === -1) {
                db.collection('household').doc(newMonth).set({ fixed: [], expense: [], income: [], refund: [], saving: [] });
                state.newMonthYear = '25';
                state.newMonthMonth = '01';
            }
        }
        function startEditMonth(month) {
            var parts = month.replace('년', '-').replace('월', '').split('-');
            state.editingMonth = month;
            state.editMonthYear = parts[0];
            state.editMonthMonth = parts[1];
            render();
        }
        function saveEditMonth() {
            if (!state.editingMonth) return;
            var mm = String(state.editMonthMonth).padStart(2, '0');
            var newName = state.editMonthYear + '년' + mm + '월';
            if (newName === state.editingMonth) { state.editingMonth = null; render(); return; }
            if (state.months.indexOf(newName) !== -1) { alert('이미 존재하는 월입니다.'); return; }
            var oldData = state.localData[state.editingMonth];
            var oldMonth = state.editingMonth;
            db.collection('household').doc(newName).set(oldData).then(function () {
                return db.collection('household').doc(oldMonth).delete();
            }).then(function () {
                if (state.activeMonth === oldMonth) {
                    state.activeMonth = newName;
                    localStorage.setItem('lastActiveMonth', newName);
                }
                state.editingMonth = null;
                render();
            }).catch(function (err) {
                console.error('월 이름 수정 실패:', err);
                alert('월 이름 수정에 실패했습니다.');
            });
        }
        function cancelEditMonth() {
            state.editingMonth = null;
            state.editMonthYear = '';
            state.editMonthMonth = '';
            render();
        }
        function deleteMonth(month) {
            if (state.months.length <= 1) { alert('마지막 월은 삭제할 수 없습니다.'); return; }
            if (confirm(month + '을 삭제하시겠습니까?')) {
                db.collection('household').doc(month).delete();
                if (state.activeMonth === month) {
                    var index = state.months.indexOf(month);
                    var newActive = state.months[index === 0 ? 1 : index - 1];
                    state.activeMonth = newActive;
                    localStorage.setItem('lastActiveMonth', newActive);
                }
            }
        }
        // ===== 백업 / 복원 =====
        function backupData() {
            // Firebase 원본(firebaseData)에 현재 로컬 변경분을 합쳐 전체 내보내기
            var allData = {};
            state.months.forEach(function (m) {
                allData[m] = state.localData[m] || state.firebaseData[m] || {};
            });
            var backup = {
                type: 'household-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                months: state.months,
                data: allData
            };
            var today = new Date();
            var stamp = today.getFullYear() + '-' +
                String(today.getMonth() + 1).padStart(2, '0') + '-' +
                String(today.getDate()).padStart(2, '0');
            var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '가계부백업_' + stamp + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('백업 파일이 저장되었습니다.\n\n📁 ' + a.download + '\n\n폰의 다운로드 폴더를 확인하세요.');
        }
        function triggerRestore() {
            document.getElementById('restoreFileInput').click();
        }
        function restoreData(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (e) {
                try {
                    var backup = JSON.parse(e.target.result);
                    if (backup.type !== 'household-backup' || !backup.data) {
                        alert('가계부 백업 파일이 아닙니다.\n올바른 파일을 선택해주세요.');
                        return;
                    }
                    var monthCount = (backup.months || []).length;
                    var dateStr = backup.exportedAt ? backup.exportedAt.slice(0, 10) : '알 수 없음';
                    if (!confirm(
                        '⚠️ 복원하면 현재 모든 데이터가\n이 백업 파일 내용으로 덮어써집니다.\n\n' +
                        '백업 날짜: ' + dateStr + '\n' +
                        '월 개수: ' + monthCount + '개\n\n' +
                        '정말 복원하시겠습니까?'
                    )) { event.target.value = ''; return; }
                    var ops = [];
                    Object.keys(backup.data).forEach(function (month) {
                        var d = backup.data[month];
                        var clean = {
                            fixed: d.fixed || [], expense: d.expense || [],
                            income: d.income || [], refund: d.refund || [], saving: d.saving || []
                        };
                        ops.push(db.collection('household').doc(month).set(clean));
                    });
                    Promise.all(ops).then(function () {
                        alert('✅ 복원이 완료되었습니다.\n화면이 자동으로 새로고침됩니다.');
                        location.reload();
                    }).catch(function (err) {
                        console.error('복원 실패:', err);
                        alert('복원 중 오류가 발생했습니다: ' + err.message);
                    });
                } catch (err) {
                    console.error('파일 읽기 실패:', err);
                    alert('파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
        // ===== 입력 핸들러 (인라인) =====
        function onMonthManageToggle() { state.showMonthManage = !state.showMonthManage; render(); }
        function onNewYear(v) { state.newMonthYear = v; }
        function onNewMonth(v) { state.newMonthMonth = v; }
        function onEditYear(v) { state.editMonthYear = v; }
        function onEditMonth(v) { state.editMonthMonth = v; }
        function onSectionToggle(type) { state.expanded[type] = !state.expanded[type]; render(); }
        // ===== 렌더링 =====
        // 입력칸에 포커스가 있으면(타이핑 중이면) 화면을 다시 그리지 않고 잠시 미룬다.
        // → 한 글자 칠 때마다 키보드가 사라지는 문제 방지
        var pendingRender = false;
        function safeRender() {
            var el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
                pendingRender = true;
                return;
            }
            render();
        }
        // 입력칸에서 포커스가 빠지면(키보드 내려가면) 미뤄둔 렌더링을 실행
        document.addEventListener('focusout', function () {
            setTimeout(function () {
                var el = document.activeElement;
                var stillEditing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
                if (pendingRender && !stillEditing) {
                    pendingRender = false;
                    render();
                }
            }, 100);
        });
        function render() {
            var root = document.getElementById('root');
            if (state.isLoading) {
                root.innerHTML = '<div class="loading-screen"><div style="text-align:center"><div class="emoji">💰</div><div class="txt">로딩 중...</div></div></div>';
                return;
            }
            var cur = getCurrentData();
            var fixedTotal = calcTotal(cur.fixed);
            var expenseTotal = calcTotal(cur.expense);
            var incomeTotal = calcTotal(cur.income);
            var refundTotal = calcTotal(cur.refund);
            var savingTotal = calcTotal(cur.saving);
            var totalExpenseWithRefund = fixedTotal + expenseTotal - refundTotal;
            var balance = incomeTotal + refundTotal - fixedTotal - expenseTotal - savingTotal;
            var html = '';
            // 헤더
            html += '<div class="header">';
            html += '<div class="header-top">';
            html += '<a href="index.html" class="back">←</a>';
            html += '<h1>💰 부부 공유 가계부</h1>';
            html += '<button class="icon-btn" onclick="onMonthManageToggle()">⚙️</button>';
            html += '</div>';
            html += '<div class="month-tabs scrollbar-hide">';
            state.months.forEach(function (month) {
                html += '<button class="month-tab' + (state.activeMonth === month ? ' active' : '') + '" ' +
                    'onclick="changeMonth(\'' + month + '\')">' + escapeHtml(month) + '</button>';
            });
            html += '</div>';
            if (state.showMonthManage) html += renderManagePanel();
            html += '</div>'; // header
            // 콘텐츠
            html += '<div class="content">';
            html += '<div class="summary-grid">';
            html += '<div class="summary-card sc-green"><div class="label">통장잔액</div><div class="value">' + formatNumber(balance) + '원</div></div>';
            html += '<div class="summary-card sc-red"><div class="label">지출합계</div><div class="value">' + formatNumber(totalExpenseWithRefund) + '원</div></div>';
            html += '<div class="summary-card sc-blue"><div class="label">수입합계</div><div class="value">' + formatNumber(incomeTotal) + '원</div></div>';
            html += '</div>';
            FIELDS.forEach(function (type) { html += renderSection(type); });
            html += '</div>';
            root.innerHTML = html;
        }
        function renderManagePanel() {
            var html = '<div class="manage-panel">';
            html += '<h3>월 관리</h3>';
            // 새 월 추가
            html += '<div><label class="manage-label">새 월 추가</label><div class="manage-row">';
            html += '<input type="number" class="num-input" value="' + escapeHtml(state.newMonthYear) + '" ' +
                'oninput="onNewYear(this.value)" onfocus="this.select()" placeholder="년">';
            html += '<span style="font-weight:bold">년</span>';
            html += '<input type="number" class="num-input" value="' + escapeHtml(state.newMonthMonth) + '" ' +
                'oninput="onNewMonth(this.value)" onfocus="this.select()" min="1" max="12" placeholder="월">';
            html += '<span style="font-weight:bold">월</span>';
            html += '<button class="btn btn-green" style="flex:1" onclick="addMonth()">추가</button>';
            html += '</div></div>';
            // 월 이름 수정
            html += '<div><label class="manage-label">월 이름 수정</label><div class="month-list">';
            state.months.forEach(function (month) {
                html += '<div class="month-list-item">';
                if (state.editingMonth === month) {
                    html += '<div style="display:flex;flex-direction:column;gap:8px">';
                    html += '<div style="display:flex;gap:8px;align-items:center">';
                    html += '<input type="number" class="num-input" value="' + escapeHtml(state.editMonthYear) + '" oninput="onEditYear(this.value)" onfocus="this.select()" placeholder="년">';
                    html += '<span style="font-weight:bold">년</span>';
                    html += '<input type="number" class="num-input" value="' + escapeHtml(state.editMonthMonth) + '" oninput="onEditMonth(this.value)" onfocus="this.select()" min="1" max="12" placeholder="월">';
                    html += '<span style="font-weight:bold">월</span>';
                    html += '</div>';
                    html += '<div style="display:flex;gap:8px">';
                    html += '<button class="btn btn-green btn-sm" style="flex:1" onclick="saveEditMonth()">저장</button>';
                    html += '<button class="btn btn-gray btn-sm" style="flex:1" onclick="cancelEditMonth()">취소</button>';
                    html += '</div></div>';
                } else {
                    html += '<div class="month-list-row"><span style="font-weight:500">' + escapeHtml(month) + '</span>';
                    html += '<button class="btn btn-blue btn-sm" onclick="startEditMonth(\'' + month + '\')">✏️ 수정</button></div>';
                }
                html += '</div>';
            });
            html += '</div></div>';
            // 월 삭제
            html += '<div><label class="manage-label">월 삭제</label><div class="month-list">';
            state.months.forEach(function (month) {
                html += '<div class="month-list-item"><div class="month-list-row">';
                html += '<span style="font-weight:500">' + escapeHtml(month) + '</span>';
                html += '<button class="btn btn-red btn-sm" onclick="deleteMonth(\'' + month + '\')">삭제</button>';
                html += '</div></div>';
            });
            html += '</div></div>';
            // 데이터 백업 / 복원
            html += '<div style="border-top:1px solid #e5e7eb;margin:4px 0 16px;padding-top:16px">';
            html += '<label class="manage-label">💾 데이터 백업</label>';
            html += '<div style="font-size:12px;color:#6b7280;margin-bottom:8px;line-height:1.5">백업 버튼을 누르면 모든 가계부 내역이 파일로 저장됩니다. 가끔 눌러두면 안심이에요.</div>';
            html += '<div style="display:flex;gap:8px">';
            html += '<button class="btn btn-green" style="flex:1" onclick="backupData()">💾 백업하기</button>';
            html += '<button class="btn btn-gray" style="flex:1" onclick="triggerRestore()">📂 복원하기</button>';
            html += '</div>';
            html += '</div>';
            html += '<button class="btn btn-gray" style="width:100%;margin-top:4px" onclick="onMonthManageToggle()">닫기</button>';
            html += '</div>';
            return html;
        }
        function renderSection(type) {
            var meta = SECTION_META[type];
            var cur = getCurrentData();
            var items = cur[type] || [];
            var isExpanded = state.expanded[type];
            var html = '<div class="section">';
            html += '<button class="section-header ' + meta.sh + '" onclick="onSectionToggle(\'' + type + '\')">';
            html += '<span class="title">' + meta.emoji + ' ' + meta.label + '</span>';
            html += '<span>' + (isExpanded ? '▲' : '▼') + '</span>';
            html += '</button>';
            if (isExpanded) {
                html += '<div class="section-body"><div class="item-list">';
                if (items.length === 0) {
                    html += '<div class="empty">' + meta.label + ' 내역이 없습니다</div>';
                } else {
                    sortByDate(items, type).forEach(function (item) {
                        var isEditing = state.editingItems[type + '-' + item.id];
                        html += '<div class="item ' + meta.ib + '">';
                        html += '<div class="item-top">';
                        html += '<input type="date" class="item-date" value="' + escapeHtml(item.date) + '" ' +
                            'oninput="updateItem(\'' + type + '\',' + item.id + ',\'date\',this.value)" ' +
                            (isEditing ? '' : 'disabled') + '>';
                        html += '<button class="del-btn" onclick="deleteItem(\'' + type + '\',' + item.id + ')">🗑️</button>';
                        html += '</div>';
                        html += '<input type="text" class="item-content" value="' + escapeHtml(item.content) + '" ' +
                            'placeholder="내용을 입력하세요" ' +
                            'oninput="updateItem(\'' + type + '\',' + item.id + ',\'content\',this.value)" ' +
                            (isEditing ? '' : 'disabled') + '>';
                        html += '<div class="item-amount-row">';
                        if (isEditing) {
                            html += '<input type="number" class="item-amount-input" value="' + escapeHtml(item.amount) + '" ' +
                                'placeholder="금액" ' +
                                'oninput="updateItem(\'' + type + '\',' + item.id + ',\'amount\',this.value)">';
                        } else {
                            html += '<div class="item-amount-view">' + formatNumber(item.amount) + '원</div>';
                        }
                        html += '<button class="edit-btn ' + (isEditing ? 'editing' : 'normal') + '" ' +
                            'onclick="' + (isEditing ? 'completeEdit' : 'toggleEdit') + '(\'' + type + '\',' + item.id + ')">' +
                            (isEditing ? '완료' : '수정') + '</button>';
                        html += '</div></div>';
                    });
                }
                html += '</div>';
                html += '<button class="add-btn ' + meta.sh + '" onclick="addItem(\'' + type + '\')">＋ ' + meta.label + ' 추가</button>';
                html += '</div>';
            }
            html += '</div>';
            return html;
        }
    </script>
</body>
</html>
